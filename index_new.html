        ## Why AI safety and not AI ethics?
        - The ethical aspects and challenges of AI are nowadays almost common knowledge (even the Pope talked about them). <!-- .element: class="fragment" data-fragment-index="1" -->
        - The misuse or the criminal use of AI is well documented and well known by the general public. <!-- .element: class="fragment" data-fragment-index="2" --> 
        - AI Safety is a pretty recent buzzword that also encompasses: <!-- .element: class="fragment" data-fragment-index="3" -->
          - Possible attacks on an ethically developed AI. <!-- .element: class="fragment" data-fragment-index="4" -->
          - Safe use of third-party AI systems (e.g. ChatGPT and similar). <!-- .element: class="fragment" data-fragment-index="5" -->
          - Good practices of AI development (from data collection to AI system dismissal). <!-- .element: class="fragment" data-fragment-index="6" -->
          - Focus on safety, a more concrete and measurable quality than ethics. <!-- .element: class="fragment" data-fragment-index="7" -->

        ## AI Regulations
        ### The EU AI Act
        ---
        ### Why Regulate AI?
        - AI is increasingly used in high-risk domains: healthcare, criminal justice, hiring, autonomous driving. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Most AI systems are opaque: users cannot understand why a decision was made. <!-- .element: class="fragment" data-fragment-index="2" -->
        - AI operates across borders, but laws are national. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Without regulation, the incentive is to move fast and break things. <!-- .element: class="fragment" data-fragment-index="4" -->

        Note:
        Self-driving cars are a perfect example: they cross borders, make life-or-death decisions, and use opaque deep learning models.
        ---
        ### The EU AI Act
        - First comprehensive AI law in the world. Entered into force **1 Aug 2024**. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Risk-based approach: AI systems classified into four tiers. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Phased rollout (application dates): <!-- .element: class="fragment" data-fragment-index="3" -->
          - **2 Feb 2025**: prohibited practices + AI literacy. <!-- .element: class="fragment" data-fragment-index="4" -->
          - **2 Aug 2025**: general-purpose AI (GPAI) model obligations. <!-- .element: class="fragment" data-fragment-index="5" -->
          - **2 Aug 2026**: most rules incl Annex III high-risk requirements. <!-- .element: class="fragment" data-fragment-index="6" -->
          - **2 Aug 2027**: some high-risk AI in regulated products. <!-- .element: class="fragment" data-fragment-index="7" -->

        [European Commission](https://commission.europa.eu/news-and-media/news/ai-act-enters-force-2024-08-01_en) · [Implementation timeline](https://ai-act-service-desk.ec.europa.eu/en/ai-act/eu-ai-act-implementation-timeline) · [EUR-Lex 2024/1689](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng) <!-- .element: class="smaller" -->

        Note:
        Primary sources: European Commission announcement (entry into force), EUR-Lex legal text, and the EU AI Act Service Desk timeline/Annex III pages.
        ---
        ### EU AI Act -- Risk Pyramid
        <img src="./img_new/eu_ai_act_pyramid.svg" height="450">

        Self-driving cars = **HIGH RISK** (Annex III, critical infrastructure). <!-- .element: class="fragment" data-fragment-index="1" -->

        Note:
        Autonomous driving requires risk management systems, data governance, human oversight, and conformity assessment under the EU AI Act.
        ---
        ### EU AI Act -- Penalties
        | Violation | Max Fine |
        |---|---|
        | Prohibited AI practices | €35M or **7%** global turnover |
        | High-risk system violations | €15M or **3%** global turnover |
        | Incorrect information to authorities | €7.5M or **1%** global turnover |

        [EUR-Lex 2024/1689](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng) <!-- .element: class="smaller" -->

        Note:
        These are the highest per-category, whichever is greater applies.
        ---
        ### Global Regulatory Landscape
        - **EU**: Risk-based regulation (EU AI Act). <!-- .element: class="fragment" data-fragment-index="1" -->
        - **US**: Executive orders + NIST frameworks (voluntary). <!-- .element: class="fragment" data-fragment-index="2" -->
        - **China**: Algorithm regulation + mandatory registration. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Self-driving example: Waymo in London/UK (Europe) highlights fragmented approvals across jurisdictions (EU member states vs UK vs US). <!-- .element: class="fragment" data-fragment-index="4" -->

        [NIST AI 100-2 E2025](https://csrc.nist.gov/pubs/ai/100/2/e2025/final) · [Waymo in the UK](https://waymo.com/waymo-in-uk) <!-- .element: class="smaller" -->

        Note:
        The UK is not in the EU; “Europe” often implies multiple overlapping regimes (EU AI Act + member-state rules + UK-specific approvals).

        ## The Politics of AI Regulation
        ### Why Regulations Alone May Not Be Enough
        ---
        ### Fines as Cost of Doing Business
        - Big Tech paid **$8.2B** in fines in 2024. <!-- .element: class="fragment" data-fragment-index="1" -->
        - They could cover it in **under 3 weeks** of free cash flow: <!-- .element: class="fragment" data-fragment-index="2" -->
          - Amazon: $57M fine = **1 day** <!-- .element: class="fragment" data-fragment-index="3" -->
          - Meta: $1.46B = **10 days** <!-- .element: class="fragment" data-fragment-index="3" -->
          - Google: $2.97B = **17 days** <!-- .element: class="fragment" data-fragment-index="3" -->
        - If expected profit > sanction, rational actors will break the rules. <!-- .element: class="fragment" data-fragment-index="4" -->

        [Proton Big Tech Fines Tracker](https://proton.me/blog/big-tech-pays-fines-under-3-weeks) <!-- .element: class="smaller" -->
        ---
        ### Case Study: Clearview AI
        - Facial recognition company scraped **billions** of images from social media without consent. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Received **$100M+** in EU GDPR fines (Netherlands €30.5M, France, Greece, Italy, UK). <!-- .element: class="fragment" data-fragment-index="2" -->
        - Reports indicate Clearview disputed the decisions and enforcement across borders remains difficult. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Criminal complaint filed only in October 2025. <!-- .element: class="fragment" data-fragment-index="4" -->

        [Dutch DPA](https://www.autoriteitpersoonsgegevens.nl/en/current/dutch-dpa-imposes-a-fine-on-clearview-because-of-illegal-data-collection-for-facial-recognition) · [Noyb](https://noyb.eu/en/criminal-complaint-against-facial-recognition-company-clearview-ai) · [The Register](https://www.theregister.com/2025/10/28/noyb_criminal_charges_clearview) <!-- .element: class="smaller" -->
        ---
        ### Big Tech Lobbying on AI Rules
        - Meta: **$6.5M** lobbying spend in Q4 2025 alone. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Google and Microsoft lobbied to **remove** "large-scale illegal discrimination" from EU AI Act systemic risks. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Code of Practice contractor (Wavestone) has commercial ties with Microsoft. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Civil society groups (e.g. Reporters Without Borders) **withdrew** due to Big Tech's overwhelming influence. <!-- .element: class="fragment" data-fragment-index="4" -->

        [Corporate Europe Observatory](https://corporateeurope.org/en/2025/04/eu-under-heavy-big-tech-pressure-weaken-rules-advanced-ai) · [Axios](https://www.axios.com/2026/01/21/meta-big-tech-lobbying-spending-q4) <!-- .element: class="smaller" -->

        Note:
        Axios cites official US lobbying disclosures (quarterly). CEO provides EU-side reporting on lobbying pressure during AI Act / Code of Practice discussions.
        ---
        ### The Revolving Door
        - **36+** people moved from UK tech regulators/government to Big Tech firms. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Former FCC Chair Ajit Pai → CEO of CTIA (top wireless lobbying org). <!-- .element: class="fragment" data-fragment-index="2" -->
        - Companies with ex-regulators are more likely to receive government contracts within 2 years. <!-- .element: class="fragment" data-fragment-index="3" -->

        [Tortoise Media](https://www.tortoisemedia.com/2025/04/03/public-officials-joining-tech-firms-raise-fears-of-unregulated-revolving-door) <!-- .element: class="smaller" -->
        ---
        ### Regulations Crush Small Players
        - Fixed compliance costs hit startups harder than incumbents (legal, audits, documentation). <!-- .element: class="fragment" data-fragment-index="1" -->
        - Harvard Kennedy School analysis: a 200% increase in fixed compliance costs can swing an AI startup margin from +13% to **-7%**. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Patchwork: **1,000+** AI-related bills introduced in US states in 2025 alone. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Self-driving example: safety cases + data governance can be existential for an ADS startup. <!-- .element: class="fragment" data-fragment-index="4" -->

        [HKS Student Policy Review](https://studentreview.hks.harvard.edu/why-compliance-costs-of-ai-commercialization-maybe-holding-start-ups-back/) · [Lawfare](http://www.lawfareblog.com/article/1-000-ai-bills--time-for-congress-to-get-serious-about-preemption) · [Cato](https://www.cato.org/commentary/ai-privacy-rules-meant-big-tech-could-hurt-small-businesses-most) <!-- .element: class="smaller" -->
        ---
        ### Case Study: Cruise Cover-Up
        - Oct 2023: Cruise robotaxi struck and **dragged a pedestrian 20 feet** in San Francisco. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Company deliberately **withheld the dragging video** from NHTSA. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Result: $500K criminal penalty, $1.5M NHTSA fine, CEO resigned, operations suspended. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Total fines **< $2.5M** vs. billions in valuation. Is that a deterrent? <!-- .element: class="fragment" data-fragment-index="4" -->

        ### Bias in Self-Driving Cars
        - Pedestrian detectors are **28-31% less likely** to detect darker-skinned people. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Detection accuracy for adults is **19.62% higher** than for children. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Bias **worsens at night**: undetected dark-skinned pedestrians rise from 7.14% (day) to 9.86% (night). <!-- .element: class="fragment" data-fragment-index="3" -->
        - Root cause: imbalanced training data. <!-- .element: class="fragment" data-fragment-index="4" -->

        [King's College London](https://www.kcl.ac.uk/news/driverless-cars-worse-at-detecting-children-and-darker-skinned-pedestrians-say-scientists) <!-- .element: class="smaller" -->
        ---
        ## Well, can we fix this right?
        ### How? <!-- .element: class="fragment" data-fragment-index="1" -->
        ---
        ### First of all we need to detect the problem!
        - How did we test the model?  <!-- .element: class="fragment" data-fragment-index="1" -->
          - Were train/validation/test sets collected from the same distribution of data? <!-- .element: class="fragment" data-fragment-index="2" -->
          - What metrics did we use to evaluate the performance? <!-- .element: class="fragment" data-fragment-index="3" -->
          - What do we mean by performance? <!-- .element: class="fragment" data-fragment-index="4" -->

        Note: 
        Example of bad calibrated cameras in self-driving cars.
        ---
        ### But if we remove all gender, ethnicity, or unwanted information from the data?
        - The AI system can infer them from remaining information! <!-- .element: class="fragment" data-fragment-index="1" -->
          - Gender from height/weight ratio. <!-- .element: class="fragment" data-fragment-index="2" -->
          - Ethnicity from specific disorders.  <!-- .element: class="fragment" data-fragment-index="3" -->
          - Level of wealth from geographical information. <!-- .element: class="fragment" data-fragment-index="4" -->
          - ... <!-- .element: class="fragment" data-fragment-index="5" -->

        Beware of correlation between data and over representation! 

        A dataset for type 2 diabetes is mainly composed of overweight people

        ### The main enemy: bias

        ### Fairness Metrics
        - **Group Fairness**: equal outcomes across demographic groups. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Individual Fairness**: similar individuals get similar outcomes. <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Counterfactual Fairness**: outcome unchanged if sensitive attribute were different. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Problem: these definitions can be **mathematically incompatible**! <!-- .element: class="fragment" data-fragment-index="4" -->
        - Self-driving: should a pedestrian detector optimize for equal detection rates across skin tones, or equal error rates? <!-- .element: class="fragment" data-fragment-index="5" -->
        ---

        <!-- .slide: data-auto-animate data-transition="slide-in fade-out" -->
        ### How to deal with bias
        - Concretely:
          - Labeled data: <!-- .element: class="fragment" data-fragment-index="1" -->
            - Balance unbalanced datasets. <!-- .element: class="fragment" data-fragment-index="2" -->
            - Remove data that contribute (most) to the bias.  <!-- .element: class="fragment" data-fragment-index="3" -->  
              [Improving Subgroup Robustness via Data Selection](https://proceedings.neurips.cc/paper_files/paper/2024/hash/abbbb25cddb2c2cd08714e6bfa2f0634-Abstract-Conference.html) <!-- .element: class="fragment smaller" data-fragment-index="3" -->

        ## Data Safety - Attacks
        ---
        ### Attack Taxonomy (NIST AI 100-2)
        <img src="./img_new/attack_taxonomy.svg" height="450">

        [NIST AI 100-2 E2025](https://csrc.nist.gov/pubs/ai/100/2/e2025/final) <!-- .element: class="smaller" -->

        Note:
        Three main categories: Evasion (inference-time), Poisoning (training-time), Privacy (post-deployment). Published March 2025.
        ---
        ### Threat Modeling for AI Systems (1/3)
        **What are we protecting?**
        - **Safety**: prevent harm (collisions, near-misses, unsafe actions) <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Integrity**: correct outputs, no malicious manipulation <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Availability**: the system works when needed (DoS, outages) <!-- .element: class="fragment" data-fragment-index="3" -->
        - **Privacy**: training data, user data, telemetry <!-- .element: class="fragment" data-fragment-index="4" -->
        - **IP**: weights, prompts, datasets, evaluation artifacts <!-- .element: class="fragment" data-fragment-index="5" -->

        Note:
        Threat modeling is the bridge between “cool attack papers” and real safety engineering.
        Suggested starting points: NIST AI RMF 1.0 + NIST AI 100-2 taxonomy.

        ---
        ### Threat Modeling (2/3): Attacker Capabilities
        - **Black-box**: only query access (API) or sensor exposure (physical world) <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Gray-box**: partial knowledge (architecture hints, logs, training details) <!-- .element: class="fragment" data-fragment-index="2" -->
        - **White-box**: full access (weights, gradients, training pipeline) <!-- .element: class="fragment" data-fragment-index="3" -->
        - Access positions: **data supplier**, **model provider**, **operator**, **end user**, **bystander** <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Threat Modeling (3/3): Attack Surfaces
        - **Data pipeline**: collection, labeling, storage, ingestion <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Training**: poisoning, backdoors, hyperparameter sabotage <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Model artifacts**: malicious weights / unsafe deserialization <!-- .element: class="fragment" data-fragment-index="3" -->
        - **Deployment**: monitoring gaps, unsafe integrations, prompt injection in copilots <!-- .element: class="fragment" data-fragment-index="4" -->
        - **Humans & process**: social engineering, policy gaps, “automation bias” <!-- .element: class="fragment" data-fragment-index="5" -->

        ---
        ### Self-Driving Stack (Simplified)
        1. **Perception**: detect lanes, vehicles, pedestrians, signs
        2. **Prediction**: forecast other agents’ motion
        3. **Planning**: choose safe trajectories and maneuvers
        4. **Control**: execute steering / braking / throttle

        ---
        ### Where Attacks Land (Self-Driving)
        - Evasion (patches) → **Perception** <!-- .element: class="fragment" data-fragment-index="1" -->
        - Sensor spoofing (LiDAR/GPS) → **Perception + Localization** <!-- .element: class="fragment" data-fragment-index="2" -->
        - Poisoning/backdoors → **Training-time** (affects all downstream tasks) <!-- .element: class="fragment" data-fragment-index="3" -->
        - Prompt injection (LLM copilots) → **Operations / Planning** <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Safety Impacts: 3 Common Failure Patterns
        - **False negative**: miss a pedestrian or stop sign <!-- .element: class="fragment" data-fragment-index="1" -->
        - **False positive**: phantom obstacle → hard braking / unnecessary evasive maneuvers <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Drift**: slow localization error accumulation → wrong lane/route over time <!-- .element: class="fragment" data-fragment-index="3" -->

        ---
        ### Attacks on data
        - Even if data is formally correct, it can be attacked by (malicious) third parties in different ways:
          - Adversarial attacks (real-world or hidden) <!-- .element: class="fragment" data-fragment-index="1" -->
          - Poisoning  <!-- .element: class="fragment" data-fragment-index="2" -->
          - Backdoor insertion <!-- .element: class="fragment" data-fragment-index="3" -->
          - Mislabeling <!-- .element: class="fragment" data-fragment-index="4" -->
          - Supply chain attacks <!-- .element: class="fragment" data-fragment-index="5" -->
          - ... <!-- .element: class="fragment" data-fragment-index="6" -->
        - Common goal: making the resulting model unusable, weak, attackable or exploitable.  <!-- .element: class="fragment" data-fragment-index="7" -->

        ### LiDAR Spoofing (Self-Driving)
        - **D-SLAMSpoof**: inject fake point clouds → position errors **≥ 4.2m** (exceeds lane width). <!-- .element: class="fragment" data-fragment-index="1" -->
        - Works in feature-rich environments (urban areas). <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Shadow Hack**: mirror sheets near roads → **100%** attack success at 10m against PointPillars. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Physical-world attack requiring **no digital access**. <!-- .element: class="fragment" data-fragment-index="4" -->

        ### GPS Spoofing on ADS
        - **Slow-drift attacks**: gradually deviate vehicles from correct route while remaining undetectable. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Exploits vehicle dynamics during acceleration and cruising. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Defense: GPS-IDS using physics-based models + ML anomaly detection. <!-- .element: class="fragment" data-fragment-index="3" -->

        [GPS-IDS](https://arxiv.org/html/2405.08359v2), [Slow Drift Spoofing](https://arxiv.org/abs/2401.01394) <!-- .element: class="smaller" -->
        ---
        ### Data Poisoning
        - The data used to train the model is slowly poisoned with biases, false information, new data that skew the model decisions, etc.
        - Particularly effective on large models: <!-- .element: class="fragment" data-fragment-index="1" -->
          - They are often (always) trained continually using online data. <!-- .element: class="fragment" data-fragment-index="2" -->
          - Changing online data (e.g. wikipedia articles) or inserting new poisoned data online (e.g. on social media) is easier than altering "classical" training DBs. <!-- .element: class="fragment" data-fragment-index="3" -->
          - Once biases/false information are inserted in a version of the model, it is extremely difficult to detect and remove them.  <!-- .element: class="fragment" data-fragment-index="4" -->
        - Data poisoning can be untargeted (poison all models) or targeted (e.g. a company wants to poison the rival company's models). <!-- .element: class="fragment" data-fragment-index="5" -->
        ---
        ### Data Poisoning: How It Works
        - **Label-flipping**: change 40% of "car" labels to "pedestrian" → model confuses cars for pedestrians. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Clean-label**: only **~50** poisoned images needed for transfer learning attacks. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Global accuracy stays high → hard to detect. <!-- .element: class="fragment" data-fragment-index="3" -->

        <img class="fragment" data-fragment-index="4" src="./img_new/poisoning_flow.svg" height="250">

        [MarkTechPost: Label Flipping on CIFAR-10](https://www.marktechpost.com/2026/01/11/a-coding-guide-to-demonstrate-targeted-data-poisoning-attacks-in-deep-learning-by-label-flipping-on-cifar-10-with-pytorch/) <!-- .element: class="smaller" -->
        ---
        ### Data Poisoning: Problems
        - A huge amount of data is required to poison a model. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Even if poisoned data is spread online, it is not certain that the poisoned data is used to train the target model. <!-- .element: class="fragment" data-fragment-index="2" -->
        - False or poisoned data can be recognized by humans/filters and deleted or discarded during data collection. <!-- .element: class="fragment" data-fragment-index="3" -->

        <br/>
        <br/>

        #### Solution (for image generation): Nightshade <!-- .element: class="fragment" data-fragment-index="4" -->
        ---
        <!-- .slide: class="text-xs" -->
        ### Nightshade
        - Developed to defend artists copyright against genAI models. 
        - Strengths: <!-- .element: class="fragment" data-fragment-index="1" -->
          - Few images needed to poison even a large model. <!-- .element: class="fragment" data-fragment-index="2" -->
          - Poisoned images are indistinguishable from real images.  <!-- .element: class="fragment" data-fragment-index="3" -->
       
        <br/>
        <br/>
        
        #### How it works: <!-- .element: class="fragment" data-fragment-index="4" -->

        - Take a target image $x_t$ that you want to poison (e.g. dog) and use the target model to generate an anchor image $x^a$ (e.g. cat). <!-- .element: class="fragment" data-fragment-index="5" -->
        - Use even a different feature extractor $F$ to minimize the following loss: <!-- .element: class="fragment" data-fragment-index="6" -->
        $$ \min_\delta \text{Dist}(F(x_t + \delta), F(x^a)),\ \text{subject to} \ \delta < p  $$
        - $x_t$ is now poisoned with $x^a$ features, and since $x^a$ was generated by the target model, the poisoned image has the maximum possible destructive power during the model training. <!-- .element: class="fragment" data-fragment-index="7" -->
        ---

        ### Backdoor Insertion
        - The training data is altered in order to insert a backdoor in the model. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Once the backdoor is inserted, it can be exploited to control the output of the model.  <!-- .element: class="fragment" data-fragment-index="2" -->
        - The model works normally if regular data is used. <!-- .element: class="fragment" data-fragment-index="3" -->
        
        <br/>
        <br/>

        ---
        ### Backdoor Attacks on 3D Point Clouds
        - Self-driving specific: PointBA achieves **>95%** attack success through LiDAR training data poisoning. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Attacker inserts trigger pattern into point cloud → at inference, any object with trigger is **ignored**. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Imagine a car that becomes **invisible** to other ADS. <!-- .element: class="fragment" data-fragment-index="3" -->

        [PointBA](https://arxiv.org/pdf/2103.16074) <!-- .element: class="smaller" -->
        ---
        ### Hidden Trigger Backdoor Attacks
        - Poisoned training data looks **completely normal** (correct labels, clean images). <!-- .element: class="fragment" data-fragment-index="1" -->
        - Trigger is hidden and only deployed at inference time. <!-- .element: class="fragment" data-fragment-index="2" -->
        - LOTUS: sample-specific triggers evade **13 different** detection methods. <!-- .element: class="fragment" data-fragment-index="3" -->

        [Hidden Trigger Backdoors](https://arxiv.org/pdf/1910.00033), [LOTUS](https://arxiv.org/pdf/2403.17188) <!-- .element: class="smaller" -->

        ### The rise of foundational models
        - All big AI companies are training huge general AI models, that can then be fine tuned to downstream tasks.
          - Apart from few big companies nobody has data and computing power to train them.  <!-- .element: class="fragment" data-fragment-index="1" -->
          - Rise of genAI with unbelievable performance and realism.  <!-- .element: class="fragment" data-fragment-index="2" -->
          - Huge foundational models can be fine-tuned to specific tasks.  <!-- .element: class="fragment" data-fragment-index="3" -->
          - A big leap in a plethora of different tasks.  <!-- .element: class="fragment" data-fragment-index="4" -->

        <!-- .slide: data-auto-animate -->
        ### Do you trust who trains those models?
        - What data is used for the training is undisclosed.   <!-- .element: class="fragment" data-fragment-index="1" -->
          - The use of private data they should not have used is highly probable.  <!-- .element: class="fragment" data-fragment-index="2" -->
        - We don't know what kind of biases are hidden inside the models.   <!-- .element: class="fragment" data-fragment-index="3" -->
        - We don't know if during training some biases were deliberately inserted.  <!-- .element: class="fragment" data-fragment-index="4" -->
        - The models are so big and complex that trying to discover this information is often impossible.  <!-- .element: class="fragment" data-fragment-index="5" -->
          - Usually only the weights are shared, neither training procedure nor data is released (and even if everything is OS, no one has the computational power to retrain and verify them). <!-- .element: class="fragment" data-fragment-index="6" -->
        - Data scraped from the internet is more and more intentionally poisoned or altered. <!-- .element: class="fragment" data-fragment-index="7" -->
        <br/>

        So, do you trust them?  <!-- .element: class="fragment fade-in" data-fragment-index="8" -->

        <!-- .slide: data-auto-animate -->
        So, do you trust them?  <!-- .element: class="bigger" --> 
        ---
        ### AI models under attack
        - Even if the data and the resulting AI model are safe, the latter can be attacked by (malicious) third parties in different ways:
          - (Malicious) Prompt engineering <!-- .element: class="fragment" data-fragment-index="1" -->
          - Model extraction / Model stealing <!-- .element: class="fragment" data-fragment-index="2" -->
          - Model inversion <!-- .element: class="fragment" data-fragment-index="3" -->
          - Deepfakes <!-- .element: class="fragment" data-fragment-index="4" -->
          - Denial of Service / Waste of resources <!-- .element: class="fragment" data-fragment-index="5" -->
          - ... <!-- .element: class="fragment" data-fragment-index="6" -->
        - Common goal: fooling the model into yielding wrong outputs, (mis)using the model beyond its design, extract hidden information.  <!-- .element: class="fragment" data-fragment-index="7" -->
        ---
        ### Prompt Injection Taxonomy

        <img src="./img_new/prompt_injection.svg" height="400">

        Core vulnerability: LLMs **cannot architecturally distinguish** trusted instructions from untrusted data. <!-- .element: class="fragment" data-fragment-index="1" -->

        [OWASP LLM Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html) <!-- .element: class="smaller" -->
        ---
        ### LLM App Security: The Real Attack Surface
        An LLM app is usually a *system*, not a single model:
        - **System prompt** + policies <!-- .element: class="fragment" data-fragment-index="1" -->
        - **User input** <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Tools/actions** (email, web, tickets, code) <!-- .element: class="fragment" data-fragment-index="3" -->
        - **RAG** (documents, web pages, databases) <!-- .element: class="fragment" data-fragment-index="4" -->
        - **Memory/logs** (long-term context) <!-- .element: class="fragment" data-fragment-index="5" -->

        Note:
        OWASP Top 10 for LLM Apps: Prompt Injection, Excessive Agency, and Improper Output Handling are app-level failures—not “model magic”.

        ---
        ### RAG Threat Model (Why Indirect Injection Works)
        - Untrusted content enters via: PDFs, webpages, emails, tickets, GitHub issues <!-- .element: class="fragment" data-fragment-index="1" -->
        - Retrieval pulls it into the **same context window** as instructions <!-- .element: class="fragment" data-fragment-index="2" -->
        - The model can’t reliably separate “data” from “instructions” <!-- .element: class="fragment" data-fragment-index="3" -->
        - Result: data exfiltration, tool misuse, policy bypass <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Tool-Use / Agent Risks (Excessive Agency)
        If the LLM can act, prompt injection becomes *command execution*:
        - Send emails / Slack messages <!-- .element: class="fragment" data-fragment-index="1" -->
        - Make purchases / bookings <!-- .element: class="fragment" data-fragment-index="2" -->
        - Run code / execute shell <!-- .element: class="fragment" data-fragment-index="3" -->
        - Query internal databases <!-- .element: class="fragment" data-fragment-index="4" -->

        Self-driving parallel: an operator copilot that can change fleet configuration. <!-- .element: class="fragment" data-fragment-index="5" -->

        ---
        ### Output Handling: The Quiet Footgun
        - Using model output as **SQL/HTML/commands** can create real vulnerabilities <!-- .element: class="fragment" data-fragment-index="1" -->
        - Examples: SQL injection via generated queries, XSS in summaries, prompt injection in downstream LLMs <!-- .element: class="fragment" data-fragment-index="2" -->
        - Rule of thumb: treat LLM output as **untrusted user input** <!-- .element: class="fragment" data-fragment-index="3" -->

        ---
        ### Practical Defenses (1/2): Trust Boundaries
        - Separate **instructions** from **retrieved content** (structured templates) <!-- .element: class="fragment" data-fragment-index="1" -->
        - Quote and delimit untrusted text; summarize *about* it, don’t execute it <!-- .element: class="fragment" data-fragment-index="2" -->
        - Apply least privilege to tools; prefer read-only by default <!-- .element: class="fragment" data-fragment-index="3" -->

        ---
        ### Practical Defenses (2/2): Sandboxing + Guardrails
        - Tool allowlists + argument validation <!-- .element: class="fragment" data-fragment-index="1" -->
        - Human confirmation for high-impact actions <!-- .element: class="fragment" data-fragment-index="2" -->
        - Rate limits + anomaly detection (exfil patterns) <!-- .element: class="fragment" data-fragment-index="3" -->
        - Logging + incident response playbooks <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Defensive Testing
        - Red-team the full app: prompts + RAG + tools + monitoring <!-- .element: class="fragment" data-fragment-index="1" -->
        - Regression tests: known malicious documents/prompts <!-- .element: class="fragment" data-fragment-index="2" -->
        - Continuous evaluation: model updates can change behavior overnight <!-- .element: class="fragment" data-fragment-index="3" -->

        ---
        ### (Malicious) Prompt Engineering
        - Prompt engineering:  <!-- .element: class="fragment" data-fragment-index="1" -->
          - Process of carefully crafting input instructions to maximize the effectiveness and relevance of outputs of genAI models. <!-- .element: class="fragment" data-fragment-index="2" -->
          - <!-- .element: class="fragment" data-fragment-index="3" --> Billions dollars companies are based on few lines of highly engineered prompts (<a href="https://github.com/x1xhlol/system-prompts-and-models-of-ai-tools">if you want to have fun...</a>).
        - Malicious prompt engineering: <!-- .element: class="fragment" data-fragment-index="4" -->
          - Using specific prompts or inserting tokens into regular prompts to: <!-- .element: class="fragment" data-fragment-index="5" -->
            - Bypass ethical filters of the model. <!-- .element: class="fragment" data-fragment-index="6" -->
            - Force the model to yield incorrect or wrong information. <!-- .element: class="fragment" data-fragment-index="7" -->
            - Pollute the context of the model, impacting every successive regular prompt.  <!-- .element: class="fragment" data-fragment-index="8" -->

        ### Model Extraction: How It Works
        - Step-by-step: <!-- .element: class="fragment" data-fragment-index="1" -->
          1. Find the inference API endpoint. <!-- .element: class="fragment" data-fragment-index="2" -->
          2. Query with crafted inputs. <!-- .element: class="fragment" data-fragment-index="2" -->
          3. Collect input-output pairs (shadow dataset). <!-- .element: class="fragment" data-fragment-index="2" -->
          4. Train a clone model. <!-- .element: class="fragment" data-fragment-index="2" -->
          5. Achieve **>95%** fidelity. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Cost: **$500-$5,000**. Time: **1-2 weeks**. <!-- .element: class="fragment" data-fragment-index="3" -->
        - 95.1% fidelity on Clarifai API with only **1,800 queries** ($2.16). <!-- .element: class="fragment" data-fragment-index="4" -->

        ### Model Extraction: Self-Driving
        - **TaskMaster**: extract ADS localization parameters with **centimeter-level accuracy** from just **25 seconds** of sensor data. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Black-box attack: no access to model internals needed. <!-- .element: class="fragment" data-fragment-index="2" -->
        - A competitor could reverse-engineer your entire perception stack. <!-- .element: class="fragment" data-fragment-index="3" -->

        [TaskMaster](https://qifan-sailboat.github.io/publication/acsac22/), [Carlini et al.](https://proceedings.mlr.press/v235/carlini24a.html) <!-- .element: class="smaller" -->
        ---
        ### Model Inversion: Reconstructing Faces
        - Given only access to a classifier's outputs, reconstruct faces from the training set. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **P2I** (2025): maps prediction vectors to StyleGAN latent codes. <!-- .element: class="fragment" data-fragment-index="2" -->
        - **99% fewer queries** needed compared to prior methods. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Privacy nightmare for biometric databases. <!-- .element: class="fragment" data-fragment-index="4" -->

        <img class="fragment" data-fragment-index="5" src="./img_new/model_inversion.svg" height="170">

        [P2I](https://arxiv.org/abs/2407.08127) <!-- .element: class="smaller" -->
        ---
        ### Model Inversion: Medical Data
        - **MEDUSA** (2025): reconstructs high-fidelity medical images from model outputs (gray-box). <!-- .element: class="fragment" data-fragment-index="1" -->
        - Reconstructed images viable enough to use as training data. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Self-driving: could reconstruct private driving scenes from a fleet-learning model. <!-- .element: class="fragment" data-fragment-index="3" -->

        [MEDUSA](https://proceedings.mlr.press/v258/azhar25a.html) <!-- .element: class="smaller" -->

        ### Deepfakes: The Scale of the Problem
        - Context: FBI IC3 reported **$16.6B** in US internet-crime losses in 2024. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Global estimate (survey-based): **$1.03T** stolen via scams in the past 12 months (GASA/Feedzai). <!-- .element: class="fragment" data-fragment-index="2" -->
        - Deepfakes/voice cloning lower the cost of impersonation and scale social engineering. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Example: AI-generated “Biden” robocall targeted NH primary voters (Jan 2024). <!-- .element: class="fragment" data-fragment-index="4" -->
        - FBI PSA (May 2025): AI voice + texts used to impersonate senior US officials. <!-- .element: class="fragment" data-fragment-index="5" -->

        ### What are Hallucinations?
        - LLMs generate text that is **fluent but factually wrong or fabricated**. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Types: <!-- .element: class="fragment" data-fragment-index="2" -->
          - **Type A**: Incorrect recollection of training data. <!-- .element: class="fragment" data-fragment-index="3" -->
          - **Type B**: Incorrect knowledge in training data. <!-- .element: class="fragment" data-fragment-index="4" -->
          - **Type C**: Pure fabrication (no basis in training data). <!-- .element: class="fragment" data-fragment-index="5" -->
        - Even best models hallucinate **3-86%** depending on the task. <!-- .element: class="fragment" data-fragment-index="6" -->

        ## How to Build Safe AI
        ---
        ### The long and winding road
        - Building a 100% safe AI is impossible and beyond our control. <!-- .element: class="fragment" data-fragment-index="1" -->
          - Biases hidden in the data, bad labeling, etc. <!-- .element: class="fragment" data-fragment-index="2" -->
          - Security flaws in HDDs where the data is stored, libraries/frameworks used, etc. <!-- .element: class="fragment" data-fragment-index="3" -->
          - Adversarial examples, model inversion, flawed third party AIs, etc. <!-- .element: class="fragment" data-fragment-index="4" -->
        - But we can do our best!  <!-- .element: class="fragment" data-fragment-index="5" -->
          - Following guidelines to build safe AIs in the particular domain.   <!-- .element: class="fragment" data-fragment-index="6" -->
          - Have a critical and objective view of the possible problems of the AI you are building.  <!-- .element: class="fragment" data-fragment-index="7" -->
          - Mind that every phase of AI development is important to the overall safety! <!-- .element: class="fragment" data-fragment-index="8" -->
            - From design to data acquisition, to development to end of life! <!-- .element: class="fragment" data-fragment-index="9" -->
        ---
        ### Defense-in-Depth

        <img src="./img_new/defense_layers.svg" height="400">

        Self-driving: cameras + radars, multiple independent AI models, simulation before deployment. <!-- .element: class="fragment" data-fragment-index="1" -->
        ---
        ### MLSecOps / AI SafetyOps (Making Safety Repeatable)
        Safety is not a one-time checklist — it’s a pipeline:
        - Versioned **data** and **models** <!-- .element: class="fragment" data-fragment-index="1" -->
        - Automated evaluation gates (before release) <!-- .element: class="fragment" data-fragment-index="2" -->
        - Secure artifacts and supply chain controls <!-- .element: class="fragment" data-fragment-index="3" -->
        - Monitoring + incident response (after release) <!-- .element: class="fragment" data-fragment-index="4" -->

        Note:
        This is the operational side of defense-in-depth. Good references: NIST AI RMF (Govern/Map/Measure/Manage) + OWASP LLM Top 10 for app risks.

        ---
        ### Data Lineage & Governance
        - Dataset versioning (what changed, when, and why?) <!-- .element: class="fragment" data-fragment-index="1" -->
        - Provenance: source, licensing, and consent (especially for web-scale data) <!-- .element: class="fragment" data-fragment-index="2" -->
        - Labeling guidelines + audits (reduce silent label noise) <!-- .element: class="fragment" data-fragment-index="3" -->
        - Access control + checksums (tamper-evidence) <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Model Registry & Artifact Security
        - Treat models as **code artifacts** (they can carry malware or backdoors) <!-- .element: class="fragment" data-fragment-index="1" -->
        - Prefer safe formats (e.g., **safetensors** vs unsafe pickle) <!-- .element: class="fragment" data-fragment-index="2" -->
        - Sign + hash models; track SBOM-like metadata for ML assets <!-- .element: class="fragment" data-fragment-index="3" -->
        - Scan third-party models before use; sandbox model loading <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Evaluation Gates (Pre-Deployment)
        - Accuracy is necessary but not sufficient — test the **tail** and the **worst case** <!-- .element: class="fragment" data-fragment-index="1" -->
        - Robustness: adversarial, corruption, OOD, sensor stress tests <!-- .element: class="fragment" data-fragment-index="2" -->
        - Privacy: membership inference / inversion risk checks <!-- .element: class="fragment" data-fragment-index="3" -->
        - Safety: scenario simulation + red-team playbooks <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Deployment Controls (Reduce Blast Radius)
        - Canary releases + staged rollout <!-- .element: class="fragment" data-fragment-index="1" -->
        - Fast rollback (model registry + pinned dependencies) <!-- .element: class="fragment" data-fragment-index="2" -->
        - Rate limits and abuse detection (prevents extraction / DoS) <!-- .element: class="fragment" data-fragment-index="3" -->
        - Human override / safe-state fallbacks in safety-critical systems <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### Monitoring (Post-Deployment)
        - Data drift + concept drift detection <!-- .element: class="fragment" data-fragment-index="1" -->
        - Safety KPIs: near-misses, disengagements, false braking events <!-- .element: class="fragment" data-fragment-index="2" -->
        - Security KPIs: prompt injection attempts, tool-abuse signals, anomalous query patterns <!-- .element: class="fragment" data-fragment-index="3" -->

        ---
        ### Incident Response for AI Systems
        - Detect → contain → eradicate → recover (classic IR) <!-- .element: class="fragment" data-fragment-index="1" -->
        - Preserve evidence (logs, model versions, prompts, retrieved docs) <!-- .element: class="fragment" data-fragment-index="2" -->
        - Patch: data filters, tool isolation, model updates, policy changes <!-- .element: class="fragment" data-fragment-index="3" -->
        - Postmortems + regression tests so the same failure can’t recur silently <!-- .element: class="fragment" data-fragment-index="4" -->

        ---
        ### How to Improve Safety of AIs
        - <!-- .element: class="fragment" data-fragment-index="1" --> If it's possible use explainable AI models <span class="fragment" data-fragment-index="2">(spoiler: often not possible).</span> 
        - <!-- .element: class="fragment" data-fragment-index="3" --> Use at least 2 <u>totally different</u> AI models in safety critical applications. 
          - Different data used to train them, different model architectures, different outputs, etc.  <!-- .element: class="fragment" data-fragment-index="4" -->
          - Validate the output of each of them with one another.   <!-- .element: class="fragment" data-fragment-index="5" -->
        - Simulate before deploying.  <!-- .element: class="fragment" data-fragment-index="6" -->
          - Use simulations or simulated data to test the behavior of the model, especially in corner cases.  <!-- .element: class="fragment" data-fragment-index="7" -->
          - If possible use human actions/decisions to calibrate the model.   <!-- .element: class="fragment" data-fragment-index="8" -->
        - Use adversarial models to find out flaws, biases and backdoors in the model.  <!-- .element: class="fragment" data-fragment-index="9" -->

        Note: 
        2 models -> example amba-aur

        simulation -> self driving car system active but without control, to check with the driver decision real time. 
        ---
        ### Adversarial Training
        - Train models **with** adversarial examples to build robustness. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Randomized smoothing**: certified robustness with provable guarantees. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Trade-off: computational cost vs. guaranteed robustness. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Self-driving: train stop-sign detectors with adversarially perturbed signs to resist sticker attacks. <!-- .element: class="fragment" data-fragment-index="4" -->

        [ICML 2025](https://proceedings.mlr.press/v267/xin25a.html) <!-- .element: class="smaller" -->
        ---
        ### Differential Privacy
        - Add **calibrated noise** to protect individual data points during training. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **DP-SGD**: differentially private stochastic gradient descent. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Trade-off: privacy vs. model accuracy. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Self-driving: fleet learning where vehicles share model updates **without** exposing individual driving routes or passenger data. <!-- .element: class="fragment" data-fragment-index="4" -->

        [DP-FedSecure](https://link.springer.com/article/10.1007/s10994-025-06888-w) <!-- .element: class="smaller" -->
        ---
        ### Sensor Redundancy and Fusion
        - Use **multiple totally different** sensor types: camera, radar, LiDAR, ultrasonics. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Cross-validation between sensors. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Camera sees phantom object but radar doesn't → system can reason about it. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Analogy to the "2 different AI models" principle applied to hardware. <!-- .element: class="fragment" data-fragment-index="4" -->
        ---
        ### AI Red Teaming
        - **NIST AI RMF** framework: red-teaming as organizational governance requirement. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Diverse teams: technical AI security + domain expertise + ethical perspectives. <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Continuous** testing, not one-shot. Must evolve as attacks evolve. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Self-driving: red-team ADS by simulating adversarial conditions (sun glare, heavy rain, unusual pedestrian behavior). <!-- .element: class="fragment" data-fragment-index="4" -->

        [NIST CAISI](https://www.nist.gov/blogs/caisi-research-blog/insights-ai-agent-security-large-scale-red-teaming-competition) <!-- .element: class="smaller" -->
        ---
        ### AI Alignment
        - The alignment problem: ensuring AI systems pursue **intended** goals. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **RLHF** (Reinforcement Learning from Human Feedback): trains reward models on human preferences. <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Constitutional AI**: AI self-critique against explicit ethical principles. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Limitations: can optimize for approval rather than safety, may encode human biases. <!-- .element: class="fragment" data-fragment-index="4" -->
        - Self-driving: aligning objective function -- minimize travel time vs. maximize safety vs. passenger comfort. <!-- .element: class="fragment" data-fragment-index="5" -->

        <img class="fragment" data-fragment-index="6" src="./img_new/alignment_diagram.svg" height="220">

        [Anthropic's Constitutional AI](https://mbrenndoerfer.com/writing/constitutional-ai-principles-critique-revision-cai-training) <!-- .element: class="smaller" -->
        ---
        ### Model Watermarking
        - Protect IP and detect AI-generated content. <!-- .element: class="fragment" data-fragment-index="1" -->
        - **InvisMark**: invisible watermarks for AI images, 97% bit accuracy under distortions. <!-- .element: class="fragment" data-fragment-index="2" -->
        - **LLM watermarks**: embed signatures in model's latent space. <!-- .element: class="fragment" data-fragment-index="3" -->
        - Self-driving: watermark ADS models to detect unauthorized copying or tampering. <!-- .element: class="fragment" data-fragment-index="4" -->

        [InvisMark, WACV 2025](https://openaccess.thecvf.com/content/WACV2025/papers/Xu_InvisMark_Invisible_and_Robust_Watermarking_for_AI-Generated_Image_Provenance_WACV_2025_paper.pdf) <!-- .element: class="smaller" -->

        <!-- SECTION 9: ISO/PAS 8800                                      -->
        <!-- ============================================================ -->
        ### How to Improve Safety of AIs - ISO/PAS 8800
        - Standard ISO that regulates "Road vehicles — Safety and Artificial Intelligence".  <!-- .element: class="fragment" data-fragment-index="1" -->
        - Published in Dec. 2024. <!-- .element: class="fragment" data-fragment-index="2" -->
        - Covers all the use of AI in road vehicles, from driving assistant technologies to ADS (another ISO standard is currently under publication for ADS only). <!-- .element: class="fragment" data-fragment-index="3" -->
        - Many concepts can be applied 1:1 to any safety critical domain. <!-- .element: class="fragment" data-fragment-index="4" -->
        - Full of references to other normatives/ISO standards, from SW/HW testing to IT infrastructure and cybersecurity. <!-- .element: class="fragment" data-fragment-index="5" -->
        - No mention of possible attacks to AI models. <!-- .element: class="fragment" data-fragment-index="6" -->

        ---
        ### Standards: How They Fit Together (Road Vehicles)
        - **ISO/PAS 8800**: AI safety assurance for road vehicles (AI-specific) <!-- .element: class="fragment" data-fragment-index="1" -->
        - **ISO 26262**: functional safety (accidental faults) <!-- .element: class="fragment" data-fragment-index="2" -->
        - **ISO/SAE 21434 + UNECE R155**: cybersecurity engineering + CSMS (intentional attackers) <!-- .element: class="fragment" data-fragment-index="3" -->
        - **UNECE R156**: software updates + SUMS (safe update process) <!-- .element: class="fragment" data-fragment-index="4" -->

        Note:
        AI safety intersects functional safety + cybersecurity. If you only do “AI safety”, you may still ship an unsafe system.

        ---
        ### ISO 26262 (Functional Safety)
        - Focus: hazards from **malfunctioning behavior** (random HW faults + systematic SW faults) <!-- .element: class="fragment" data-fragment-index="1" -->
        - Key practice: HARA (Hazard Analysis and Risk Assessment) + safety lifecycle <!-- .element: class="fragment" data-fragment-index="2" -->
        - Self-driving: safe-state behavior and fault-tolerant architectures matter as much as perception accuracy <!-- .element: class="fragment" data-fragment-index="3" -->

        [ISO 26262-2:2018 (ISO page)](http://committee.iso.org/standard/68384.html) <!-- .element: class="smaller" -->

        ---
        ### ISO/SAE 21434 + UNECE R155 (Cybersecurity)
        - Focus: hazards from **intentional** attacks (TARA, threat actors, attack paths) <!-- .element: class="fragment" data-fragment-index="1" -->
        - UNECE R155 makes a **CSMS** a type-approval requirement in many markets <!-- .element: class="fragment" data-fragment-index="2" -->
        - AI safety link: ML supply chain, prompt injection, and sensor spoofing are cybersecurity problems too <!-- .element: class="fragment" data-fragment-index="3" -->

        [ISO/SAE 21434:2021 (ISO page)](http://iso.org/standard/70918.html?browse=ics) · [UNECE R155](https://unece.org/transport/documents/2021/03/standards/un-regulation-no-155-cyber-security-and-cyber-security) <!-- .element: class="smaller" -->

        ---
        ### UNECE R156 (Software Updates)
        - Requires a **SUMS** (Software Update Management System) <!-- .element: class="fragment" data-fragment-index="1" -->
        - Updates can change safety behavior — you need traceability, testing, and safe rollback <!-- .element: class="fragment" data-fragment-index="2" -->
        - AI safety link: model updates are software updates (with extra uncertainty) <!-- .element: class="fragment" data-fragment-index="3" -->

        [UNECE R156](https://unece.org/transport/documents/2021/03/standards/un-regulation-no-156-software-update-and-software-update) <!-- .element: class="smaller" -->

        ---
        ### Practical Takeaway (for AI Engineers)
        - **Safety**: test worst-case scenarios, not only averages <!-- .element: class="fragment" data-fragment-index="1" -->
        - **Security**: assume adversaries, protect the ML supply chain, and monitor for abuse <!-- .element: class="fragment" data-fragment-index="2" -->
        - **Operations**: updates need controlled rollout + rollback (treat models like software) <!-- .element: class="fragment" data-fragment-index="3" -->
        ---
        <!-- .slide: data-auto-animate class="text-xs" -->
        ### ISO/PAS 8800
        - <!-- .element: class="fragment" data-fragment-index="1" --> Based on the production of a huge amount of documentation, following the principle: <i>if I'm forced to think about safety, the final system will be safer</i>. 
          - AI safety requirements. <!-- .element: class="fragment" data-fragment-index="2" -->
          - Input space definition. <!-- .element: class="fragment" data-fragment-index="3" -->
          - Known insufficiencies of the AI system and third parties SW used. <!-- .element: class="fragment" data-fragment-index="4" -->
          - AI component or AI system architecture. <!-- .element: class="fragment" data-fragment-index="5" -->
          - Data and data collection design specification. <!-- .element: class="fragment" data-fragment-index="6" -->
          - Dataset requirements and design specifications. <!-- .element: class="fragment" data-fragment-index="7" -->
          - Dataset verification and validation reports. <!-- .element: class="fragment" data-fragment-index="8" -->
          - Dataset safety analysis report. <!-- .element: class="fragment" data-fragment-index="9" -->
          - AI system verification and validation reports.  <!-- .element: class="fragment" data-fragment-index="10" -->
          - AI system safety analysis report.  <!-- .element: class="fragment" data-fragment-index="11" -->
          - ...  <!-- .element: class="fragment" data-fragment-index="12" -->

        <!-- .slide: data-auto-animate class="text-xs" -->
        ### ISO/PAS 8800
        - <u>AI safety requirements.</u>
        - Input space definition.
        - <u>Known insufficiencies of the AI system and third parties SW used.</u>
        - AI component or AI system architecture.
        - <u>Data and data collection design specification.</u>
        - Dataset requirements and design specifications.
        - Dataset verification and validation reports.
        - <u>Dataset safety analysis report.</u>
        - AI system verification and validation reports.
        - <u>AI system safety analysis report.</u>
        - <!-- .element: class="fragment" data-fragment-index="1" --> <b>Re-evaluate and change for all the lifecycle of the system</b>
        ---
        ### ISO/PAS 8800
        - For being certified ISO/PAS 8800 compliant need to satisfy all the safety requirements (or at least have a strong justification if some requirement is not satisfied). <!-- .element: class="fragment" data-fragment-index="1" -->
        - But same guidelines may greatly improve all the AI ecosystem! <!-- .element: class="fragment" data-fragment-index="2" -->
          - There is no shame in a (possibly) unsafe AI system!  <!-- .element: class="fragment" data-fragment-index="3" -->
          - <!-- .element: class="fragment" data-fragment-index="4" --> Just attach all the documentation and <u>clearly state</u> how the system may fail and in which occasions.
          - Also include untested scenarios (e.g. I only tested my ADS in right-hand drive countries). <!-- .element: class="fragment" data-fragment-index="5" -->
          - Minimize the risk of misuse of AI systems by third parties. <!-- .element: class="fragment" data-fragment-index="6" -->
            - Will you use an online AI model to evaluate CVs if it is clearly stated that it may contain biases against women, blacks, minorities, etc.? <!-- .element: class="fragment" data-fragment-index="7" -->

        <section>

          ### Who owns AI?
          - AI needs (a big) infrastructure: <!-- .element: class="fragment" data-fragment-index="1" -->
            - The algorithm is just a small part of the product. <!-- .element: class="fragment" data-fragment-index="2" -->
            - Computational capabilities (computational power and memory) are fundamental. <!-- .element: class="fragment" data-fragment-index="3" -->
            - Only the biggest companies have the workforce to maintain a solid infrastructure. <!-- .element: class="fragment" data-fragment-index="4" -->
              - Substantial advantage over smaller companies or academia. <!-- .element: class="fragment" data-fragment-index="5" -->
        </section>
        <section>

          ### Who owns AI?
          - AI needs (a lot of) data:
            - Data is essential to reproduce results. <!-- .element: class="fragment" data-fragment-index="1" -->
            - Data is often more important than algorithm (who owns data?). <!-- .element: class="fragment" data-fragment-index="2" -->
            - Big tech companies have the possibility to own or acquire a huge amount of data. <!-- .element: class="fragment" data-fragment-index="3" -->
              - Substantial advantage over smaller companies or academia. <!-- .element: class="fragment" data-fragment-index="4" -->
        </section>

        <section>

          ## Bonus: AI and Climate Change 
        </section>
        <section>

          ### Climate change
          - What is the carbon footprint of training a large AI model?
            - <!-- .element: class="fragment" data-fragment-index="1" --> A <a href="https://arxiv.org/pdf/2104.10350">2021 paper</a> from Google estimates that a single training of GPT-3 emits ~552,000kg of CO$_2$.
              - GPT-4 is estimated to be more than 4x the size of GPT-3. <!-- .element: class="fragment" data-fragment-index="2" -->
              - We take into account HW improvement, so a 2x multiplier is applied → ~1,104,000kg of CO$_2$.  <!-- .element: class="fragment" data-fragment-index="3" -->
              - GPT-4 is trained for more than 100 days, while GPT-3 only for 14 days, so another 7x multiplier is applied → 7,728,000kg of CO$_2$.  <!-- .element: class="fragment" data-fragment-index="4" -->
        </section>
        <section>

          ### Climate change
          - But this is only one single training!
            - Let's assume at least 100 explorative training averaging 0.2x the last one. <!-- .element: class="fragment" data-fragment-index="1" -->
            - 7,728,000 + (7,728,000 $\cdot$ 0.2 $\cdot$ 100) = 162,288,000kg of CO$_2$. <!-- .element: class="fragment" data-fragment-index="2" -->
          - And what about deployment? <!-- .element: class="fragment" data-fragment-index="3" -->
            - Back-of-envelope assumption (illustrative, not a verified OpenAI number): 30,000 A100-class GPUs at ~300W each (≈9 MW). <!-- .element: class="fragment" data-fragment-index="4" -->
            - <!-- .element: class="fragment" data-fragment-index="5" --> Suppose 70% average utilization for one year → 55,188,000kWh of energy, equal to 21,718,000kg of CO$_2$ emission (<a href="https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator">source</a>).
          - Total = 184,006,000kg of emitted CO$_2$. <!-- .element: class="fragment" data-fragment-index="6" -->

          Note:
          The GPU power number varies by accelerator and form factor (e.g., A100 PCIe vs SXM), and real-world inference also depends on utilization, batching, PUE, and energy mix.
          Reference: [NVIDIA A100](https://www.nvidia.com/en-us/data-center/a100/)
        </section>
        <section>

          ### Climate change
          - To make that into perspective: 184,006,000kg of CO<sub>2</sub> emission are the same as:
            - 42,920 gasoline-powered passenger vehicles driven for one year.  <!-- .element: class="fragment" data-fragment-index="1" -->
            - 162,505 electric-powered passenger vehicles driven for one year.  <!-- .element: class="fragment" data-fragment-index="2" -->
            - 92,712,741kg of coal burned. <!-- .element: class="fragment" data-fragment-index="3" -->
            - 38,346 homes' electricity use for one year. <!-- .element: class="fragment" data-fragment-index="4" -->
            - 55 wind turbines running for a year. <!-- .element: class="fragment" data-fragment-index="5" -->
            - Carbon sequestered from 747km$^2$ of US forests. <!-- .element: class="fragment" data-fragment-index="6" -->
        </section>
        <section>

          ### Climate change
          <div class="callout takeaway">
            <span class="tag">Takeaway</span>
            <p class="mini">Carbon impact is a full lifecycle problem (hardware, training, deployment, logistics, facilities, data).</p>
            <p class="muted mini">Use the references in the appendix for deeper numbers; avoid false precision in live talks.</p>
          </div>
        </section>
        <section>

          ### Climate change
          - But here we only calculated training and deployment stages, the full carbon emission of a ML model is composed of [all these phases](https://www.sciencedirect.com/science/article/pii/S2095809924002315): 
            - ML R&D <!-- .element: class="fragment" data-fragment-index="1" -->
            - Hardware manufacturing (material extraction?) <!-- .element: class="fragment" data-fragment-index="2" -->
            - Global commercial logistics <!-- .element: class="fragment" data-fragment-index="3" -->
            - Facility O&M <!-- .element: class="fragment" data-fragment-index="4" -->
            - Massive data collection and management <!-- .element: class="fragment" data-fragment-index="5" -->
            - Model training and fine-tuning <!-- .element: class="fragment" data-fragment-index="6" -->
            - Deployment stage <!-- .element: class="fragment" data-fragment-index="7" -->
            - Material recycling and waste disposal <!-- .element: class="fragment" data-fragment-index="8" -->
        </section>
        <section>

          ### Climate change 
          - But AI and ML are (fortunately) far from being a leading cause for climate change
            - <!-- .element: class="fragment" data-fragment-index="1" --> In a month commercial airplanes emit at least 65x10$^9$kg of CO$_2$ (<a href="https://ourworldindata.org/grapher/monthly-co2-emissions-from-international-and-domestic-flights?time=2022-10-15..latest">source</a>).
            - Many companies claims to use high percentages of renewable energy for their data centers. <!-- .element: class="fragment" data-fragment-index="2" -->
            - But... <!-- .element: class="fragment" data-fragment-index="3" -->
          
          <div class="callout activity fragment" data-fragment-index="4">

        </section>

        ### To summarize
        - The widespread adoption of AI in high risk applications poses significant safety risks. <!-- .element: class="fragment" data-fragment-index="1" -->
        - Regulations exist (EU AI Act) but enforcement is weak and Big Tech lobbies to weaken them. <!-- .element: class="fragment" data-fragment-index="2" -->
        - AI models may (and will) have unexpected bad outcomes.  <!-- .element: class="fragment" data-fragment-index="3" -->
          - Bias on the data/model is a major enemy. <!-- .element: class="fragment" data-fragment-index="4" -->
          - It is often impossible to predict a priori all the possible bad outcomes. <!-- .element: class="fragment" data-fragment-index="5" -->
        - Malicious individuals may (and will) attack AI models and the data they are trained on. <!-- .element: class="fragment" data-fragment-index="6" -->
          - From adversarial examples to supply chain attacks to prompt injection. <!-- .element: class="fragment" data-fragment-index="7" -->
        - Defenses exist: adversarial training, differential privacy, red teaming, alignment, ISO standards. <!-- .element: class="fragment" data-fragment-index="8" -->
