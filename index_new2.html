## 1) AI Ethics & Safety: A Technical Framing

---
### What “AI safety” means in practice (engineering view)
- **Robustness**: performance under shift + perturbations + worst-case inputs
- **Reliability**: stable behavior under expected operating conditions
- **Alignment**: objective matches intended outcomes (specification ↔ optimization)
- **Security**: attacker-aware design (threat model + controls)

<div class="callout takeaway" style="margin-top:0.7em">
  <span class="tag">Key idea</span>
  <p class="mini">Safety is not a vibe; it is <b>constraints</b> + <b>guarantees</b> under uncertainty and adversaries.</p>
</div>

Note:
Make the point that “safety” is measurable only after you specify the environment + threat model.

---
### Ethics as constraints on system design (not philosophy)
- **Ethics**: constraints on what the system is allowed to do / optimize
- **Safety**: constraints on how the system behaves when reality disagrees with training
- **Security**: constraints on behavior when someone actively tries to break it

<div class="callout takeaway" style="margin-top:0.7em">
  <span class="tag">Design framing</span>
  <p class="mini">In safety-critical ML, ethics becomes a <b>requirements engineering</b> problem.</p>
</div>

Note:
Call out “constraints must be implementable”: logging, audits, rate limits, monitors, fail-safe states.

---
### Principles → technical interpretations
<div class="cols2">
  <div>
    <ul class="mini">
      <li><b>Fairness</b> → distributional performance guarantees<br><span class="pill muted">groups / environments / corner cases</span></li>
      <li><b>Accountability</b> → traceability of decisions<br><span class="pill muted">logs, provenance, change control</span></li>
    </ul>
  </div>
  <div>
    <ul class="mini">
      <li><b>Transparency</b> → interpretability vs attack-surface trade-off<br><span class="pill muted">explanations can leak gradients / features</span></li>
      <li><b>Privacy</b> → information leakage bounds<br><span class="pill muted">membership/inversion/extraction</span></li>
    </ul>
  </div>
</div>

## 2) Threat Models in Machine Learning

---
### Formalizing the adversary
- **Knowledge**: black-box / gray-box / white-box
- **Capabilities**: query access, training-data access, physical access
- **Constraints**: budget, stealth, time, detection risk

---
### Security goals (CIA) mapped to ML
- **Integrity**: force wrong predictions / wrong actions
- **Availability**: degrade system so it fails often / disables itself
- **Confidentiality**: extract sensitive info (training data, weights, IP)

---
### Threats by lifecycle stage
<img class="diagram" src="img_new2/threat_model_matrix.svg" alt="Threat model matrix for ML: knowledge, capabilities, goals, and lifecycle mapping" />
<div class="caption">Same attacker goals; different leverage points depending on access.</div>

---
### Threat model checklist (practical)
<div class="callout activity">
  <span class="tag">Use this</span>
  <ul class="mini">
    <li>What does the attacker observe? (inputs, outputs, internals)</li>
    <li>What can they change? (data, code, sensors, network)</li>
    <li>What is success? (targeted misclass, system shutdown, leakage)</li>
    <li>What’s the budget? (queries, poisoned points, physical time)</li>
    <li>How do we detect/contain? (monitoring + incident response)</li>
  </ul>
</div>

Note:
Make this “the template” used in every attack section.

## 3) Attack Surface in Autonomous Driving Systems

---
### End-to-end pipeline (where attacks land)
<img class="diagram" src="img_new2/ads_pipeline_attack_surface.svg" alt="Autonomous driving pipeline and attack surface: data collection to inference and control" />
<div class="caption">Pipeline: data → labeling → training → deployment → runtime inference → planning/control.</div>

---
### Components (simplified)
- **Perception**: vision models (detection, segmentation)
- **Sensor fusion**: camera + LiDAR + radar + map priors
- **Planning & control**: trajectory, constraints, actuation

Note:
Reinforce: the model is only one component; safety is a system property.

---
### Why ADS is uniquely hard
- **Real-time decisions** (latency budgets)
- **Low tolerance for error** (rare events dominate risk)
- **Open world** (shift is the default)
- **Strong incentive for adversaries** (insurance, sabotage, prank)

## 4) Data Poisoning Attacks

---
### 4.1 Formalization: bilevel optimization
<img class="diagram" src="img_new2/bilevel_poisoning.svg" alt="Bilevel optimization diagram for data poisoning: attacker modifies data to influence learned parameters" />

\[
\min_{\Delta \in \mathcal{C}} \; \mathcal{L}_{\text{val}}(\theta^\*(\Delta))
\quad \text{s.t.} \quad
\theta^\*(\Delta)=\arg\min_{\theta}\; \mathcal{L}_{\text{train}}(\theta; D \cup \Delta)
\]

Note:
Explain outer objective (attacker), inner objective (learner). Emphasize constraints: limited poisoning budget, stealth constraints.

---
### 4.2 Attack types (training-time)

---
### 4.3 ADS examples (concrete)
- **Poison traffic sign dataset**: shift STOP → SPEED LIMIT boundary
- **Rare-event manipulation**: pedestrians at night / unusual weather
- **Supply chain poisoning**: pretrained model or dataset artifact

### 4.4 Key insight: stealthiness ↔ effectiveness

## 5) Model-Level Attacks (Core)

---
### 5.1 Model inversion: goal and intuition
- **Goal**: recover (approximate) training inputs from model access
- **Why it works**: overfitting + rich outputs (confidence/gradients)
- **Impact**: leakage of sensitive images / locations / identities

---
### Inversion as optimization
\[
x^\* = \arg\min_x \; \ell\!\left(f_\theta(x), y\right) + \lambda R(x)
\]
- Query outputs, (sometimes) gradients, and optimize input \(x\)
- Stronger with: richer APIs, weak regularization, memorization

---
<img class="diagram" src="img_new2/model_inversion_flow.svg" alt="Model inversion flow: queries/gradients to reconstructed inputs" />

---
### 5.2 Membership inference: hypothesis test view
- **Question**: “Was this point in the training set?”
- **Mechanism**: training points often have lower loss / higher confidence
- **Threat**: privacy leakage even without reconstructing the data

---
<img class="diagram" src="img_new2/membership_inference_test.svg" alt="Membership inference as hypothesis testing using confidence or loss" />

---
### Demo hook (optional)
<div class="callout quiz">
  <span class="tag">Demo</span><span class="time">2–5 min</span>

</div>

---
### 5.3 Model extraction (stealing): the API is the training set
- **Goal**: train a surrogate that matches a target model
- **Method**: query inputs → collect outputs → distill / fit surrogate
- **Consequences**
  - IP theft
  - enables stronger downstream attacks (white-box-ish transfer)

---
<img class="diagram" src="img_new2/model_extraction_queries.svg" alt="Model extraction loop: queries to surrogate training and fidelity vs budget" />

</div>

- **Trigger-based manipulation**: normal accuracy looks fine
- **Clean-label vs dirty-label** poisoning
- **Persistence under transfer learning**: backdoor can survive fine-tuning

## 6) Adversarial Examples & Physical Attacks

---
### Optimization perspective
\[
x_{\text{adv}} = x + \delta,\quad \|\delta\|_p \le \epsilon,\quad
\arg\max_\delta \; \ell(f_\theta(x+\delta), y)
\]
- Small perturbation → large prediction shift
- **Transferability**: attacks often transfer across models

---
### Physical-world attacks (stop sign archetype)
<img class="diagram" src="img_new2/adversarial_physical_stop_sign.svg" alt="Digital vs physical adversarial attacks on stop sign perception" />
<div class="caption">Physical attacks must survive viewpoint, lighting, distance, camera pipeline, and defenses.</div>

---
### Why physical robustness is hard
- Uncontrolled transforms: scale, pose, weather, motion blur
- Sensor pipeline: ISP, compression, exposure, rolling shutter
- Multi-sensor fusion: success may require breaking redundancy

Note:
Introduce Expectation over Transformation (EoT) as the attacker’s trick.

## 7) Case Study: Multi-Stage Attack on a Self-Driving System

---
### Combined scenario
- Poisoned training data embeds a backdoor trigger
- Deployed model passes clean validation
- Physical trigger appears at runtime (sticker/patch)
- Failure propagates: perception → planning → control

---
<img class="diagram" src="img_new2/multi_stage_attack_chain.svg" alt="Multi-stage attack chain: poisoning + backdoor + physical trigger, and failure propagation" />

---
### Why standard validation fails
- Clean test sets don’t capture adversarial distributions
- Offline metrics miss system-level cascade failures
- Rare events are under-sampled by design

## 8) Privacy vs Robustness vs Utility Trade-offs

---
<img class="diagram" src="img_new2/privacy_robustness_utility_triangle.svg" alt="Triangle trade-off: privacy vs robustness vs utility" />

---
### Differential privacy (DP): what it buys, what it costs
- **Protects against**: membership inference, some inversion
- **Costs**: reduced accuracy (especially on tails)
- **Engineering reality**: tuning \((\varepsilon,\delta)\) is a product decision

Note:
Be honest: DP is not a magic privacy switch; it’s a budget + threat model.

## 9) Defense Mechanisms

---
### Layered defense (the only credible story)
<img class="diagram" src="img_new2/defense_layers_stack.svg" alt="Defense layers: data-level, model-level, adversarial, and system-level defenses" />

---
### 9.1 Data-level defenses
- data filtering + anomaly detection
- robust statistics / influence functions
- provenance + dataset versioning + audits

---
### 9.2 Model-level defenses
- regularization + early stopping
- calibration (don’t trust raw confidence)
- differential privacy (privacy budget)

---
### 9.3 Adversarial defenses
- adversarial training (empirical robustness)
- certified robustness (formal but limited scalability)
- input transformations + randomized smoothing (trade-offs)

---
### 9.4 System-level defenses (ADS-relevant)
- sensor redundancy (fusion)
- runtime monitors (OOD, consistency checks)
- safe fallback modes + operational design domain (ODD) gating

## 11) Ethical Implications (Grounded)

---
### Responsibility in adversarial failures
- Who is accountable: developer vs integrator vs operator?
- “Known unknowns” must be documented (threat model disclosure)
- Duty to monitor + update in the field

---
### Transparency dilemma
- More openness → easier attacks (sometimes)
- Less openness → harder audits + weaker trust
- Engineering compromise: controlled transparency (tiered access)

---
### Privacy vs safety trade-offs
- Monitoring improves safety but can become surveillance
- Data minimization conflicts with rare-event learning
- DP + federated + on-device learning: partial mitigations

---
### Dual-use research
- Publishing attacks improves defenses… and helps attackers
- Safer disclosure patterns: redacted details + timelines + mitigations

---

## 12) Political and Governance Dimensions

---
### Regulation of safety-critical AI
- Should robustness be mandatory?
- Certification vs post-market monitoring
- Standards as “default law” (industry influence)

---
### Liability frameworks
- Product liability: manufacturer / supplier
- Operator responsibility in mixed autonomy
- Evidence: logs, provenance, update history

---
### National security concerns
- Model extraction as strategic risk
- Data sovereignty + compute controls
- Asymmetric attackers (state vs small org)

---
### Global asymmetries
- Divergent regulatory approaches (EU/US/China)
- Centralization of AI power (compute + data + talent)
- Who sets the benchmarks defines “safe”
