<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Data poisoning flow</title>
  <desc id="desc">Infographic: attacker poisons training data, producing a poisoned model and wrong outputs while accuracy may remain high.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 16px; font-weight: 900; fill: #ffffff; letter-spacing: 0.02em; }
      .node { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .attacker { stroke: #ef4444; }
      .model { stroke: #fb923c; }
      .danger { stroke: #ef4444; }
      .label { font-size: 12.5px; font-weight: 800; fill: rgba(255,255,255,0.92); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.62); }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.75); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow { stroke: rgba(255,255,255,0.78); stroke-width: 2.2; fill: none; }
    ]]></style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,0.78)"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <text class="h1" x="400" y="42" text-anchor="middle">DATA POISONING</text>

    <g filter="url(#shadow)">
      <!-- Attacker -->
      <g transform="translate(40,90)">
        <rect class="node attacker" x="0" y="0" width="120" height="76" rx="16"/>
        <g transform="translate(22,38)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M -6 2 L -1 -4 L 2 3 L 6 -2"/>
        </g>
        <text class="label" x="72" y="44" text-anchor="middle">Attacker</text>
      </g>

      <!-- Training data -->
      <g transform="translate(220,76)">
        <rect class="node" x="0" y="0" width="180" height="104" rx="16"/>
        <g transform="translate(22,52)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <!-- database cylinder -->
          <ellipse cx="0" cy="-6" rx="7" ry="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
          <path class="iconStroke" d="M -7 -6 V 6 C -7 8 7 8 7 6 V -6"/>
          <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>
        <text class="label" x="110" y="34" text-anchor="middle">Training data</text>
        <text class="muted" x="110" y="54" text-anchor="middle">some samples poisoned</text>

        <!-- mini samples -->
        <g transform="translate(86,68)">
          <rect x="-40" y="-10" width="24" height="18" rx="4" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
          <rect x="-10" y="-10" width="24" height="18" rx="4" fill="rgba(239,68,68,0.20)" stroke="#ef4444" stroke-width="1.5"/>
          <rect x="20" y="-10" width="24" height="18" rx="4" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
          <rect x="-40" y="12" width="24" height="18" rx="4" fill="rgba(239,68,68,0.20)" stroke="#ef4444" stroke-width="1.5"/>
          <rect x="-10" y="12" width="24" height="18" rx="4" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
          <rect x="20" y="12" width="24" height="18" rx="4" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Model -->
      <g transform="translate(460,90)">
        <rect class="node model" x="0" y="0" width="150" height="76" rx="16"/>
        <g transform="translate(22,38)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <!-- cube -->
          <path class="iconStroke" d="M -6 -4 L 0 -8 L 6 -4 L 0 0 Z M -6 -4 V 4 L 0 8 L 0 0 M 6 -4 V 4 L 0 8"/>
        </g>
        <text class="label" x="90" y="38" text-anchor="middle">Poisoned model</text>
        <text class="muted" x="90" y="58" text-anchor="middle">looks normal</text>
      </g>

      <!-- Wrong output -->
      <g transform="translate(650,90)">
        <rect class="node danger" x="0" y="0" width="120" height="76" rx="16"/>
        <g transform="translate(22,38)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M 0 -7 L 7 7 H -7 Z"/>
        </g>
        <text class="label" x="74" y="38" text-anchor="middle">Wrong output</text>
        <text class="muted" x="74" y="58" text-anchor="middle">targeted errors</text>
      </g>

      <!-- arrows -->
      <path class="arrow" d="M 160 128 H 220" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 400 128 H 460" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 610 128 H 650" marker-end="url(#arrowHead)"/>
    </g>

    <text class="muted" x="400" y="270" text-anchor="middle">Global accuracy can stay high ? poisoning is hard to detect</text>
  </g>
</svg>
