<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">AI attacks taxonomy</title>
  <desc id="desc">Infographic taxonomy of AI attacks: Evasion, Poisoning, and Privacy, each with examples.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 800; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .body { font-size: 12.5px; font-weight: 500; fill: rgba(255,255,255,0.88); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.60); }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ev { stroke: #ef4444; }
      .evFill { fill: rgba(239,68,68,0.18); }
      .po { stroke: #fb923c; }
      .poFill { fill: rgba(251,146,60,0.18); }
      .pr { stroke: #44AFF6; }
      .prFill { fill: rgba(68,175,246,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Root pill -->
  <g class="font" filter="url(#shadow)">
    <rect class="pill" x="340" y="26" width="220" height="56" rx="14"/>
    <!-- Simple “burst” icon -->
    <g transform="translate(372,54)">
      <circle cx="0" cy="0" r="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
      <path class="iconStroke" d="M -6 -1 L 6 1 M -1 -6 L 1 6"/>
    </g>
    <text class="h1" x="450" y="60" text-anchor="middle">AI ATTACKS</text>
    <text class="muted" x="450" y="78" text-anchor="middle">Evasion · Poisoning · Privacy</text>
  </g>

  <!-- Three taxonomy cards -->
  <g class="font">
    <!-- EVASION -->
    <g transform="translate(55,120)">
      <rect class="card" x="0" y="0" width="250" height="280" rx="16" filter="url(#shadow)"/>
      <rect class="evFill" x="0" y="0" width="250" height="56" rx="16"/>
      <line class="sep" x1="0" y1="56" x2="250" y2="56"/>
      <!-- Crosshair icon -->
      <g transform="translate(28,28)">
        <circle class="iconStroke ev" cx="0" cy="0" r="12"/>
        <path class="iconStroke ev" d="M -16 0 L -6 0 M 6 0 L 16 0 M 0 -16 L 0 -6 M 0 6 L 0 16"/>
        <circle cx="0" cy="0" r="2.2" fill="#ffffff"/>
      </g>
      <text class="h2" x="58" y="34">EVASION</text>
      <text class="muted" x="58" y="50">Inference-time manipulation</text>

      <g transform="translate(22,78)">
        <text class="body" x="0" y="0">• Adversarial examples (digital)</text>
        <text class="body" x="0" y="28">• Physical-world patches / stickers</text>
        <text class="body" x="0" y="56">• Sensor spoofing (LiDAR, GPS)</text>
      </g>
    </g>

    <!-- POISONING -->
    <g transform="translate(325,120)">
      <rect class="card" x="0" y="0" width="250" height="280" rx="16" filter="url(#shadow)"/>
      <rect class="poFill" x="0" y="0" width="250" height="56" rx="16"/>
      <line class="sep" x1="0" y1="56" x2="250" y2="56"/>
      <!-- Flask icon -->
      <g transform="translate(28,28)">
        <path class="iconStroke po" d="M -6 -14 L 6 -14 M -2 -14 L -2 -6 L -10 8 C -12 11 -10 14 -6 14 L 6 14 C 10 14 12 11 10 8 L 2 -6 L 2 -14"/>
        <path class="iconStroke po" d="M -6 6 L 6 6"/>
      </g>
      <text class="h2" x="58" y="34">POISONING</text>
      <text class="muted" x="58" y="50">Training-time corruption</text>

      <g transform="translate(22,78)">
        <text class="body" x="0" y="0">• Data poisoning (targeted / untargeted)</text>
        <text class="body" x="0" y="28">• Backdoor insertion (triggers)</text>
        <text class="body" x="0" y="56">• ML supply chain attacks (models)</text>
      </g>
    </g>

    <!-- PRIVACY -->
    <g transform="translate(595,120)">
      <rect class="card" x="0" y="0" width="250" height="280" rx="16" filter="url(#shadow)"/>
      <rect class="prFill" x="0" y="0" width="250" height="56" rx="16"/>
      <line class="sep" x1="0" y1="56" x2="250" y2="56"/>
      <!-- Lock icon -->
      <g transform="translate(28,28)">
        <rect class="iconStroke pr" x="-10" y="-2" width="20" height="18" rx="4"/>
        <path class="iconStroke pr" d="M -6 -2 V -8 C -6 -14 6 -14 6 -8 V -2"/>
        <circle cx="0" cy="7" r="2.2" fill="#ffffff"/>
      </g>
      <text class="h2" x="58" y="34">PRIVACY</text>
      <text class="muted" x="58" y="50">Information extraction</text>

      <g transform="translate(22,78)">
        <text class="body" x="0" y="0">• Model extraction / stealing</text>
        <text class="body" x="0" y="28">• Model inversion (reconstruction)</text>
        <text class="body" x="0" y="56">• Membership inference</text>
      </g>
    </g>

    <text class="muted" x="450" y="432" text-anchor="middle">Adapted from NIST AI 100-2 adversarial ML taxonomy (E2025)</text>
  </g>
</svg>
