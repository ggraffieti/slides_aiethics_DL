<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Adversarial patch against a YOLO-style detector</title>
  <desc id="desc">Before/after infographic: normal detection of a stop sign vs patched sign causing a missed or wrong detection.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 16px; font-weight: 900; fill: #ffffff; letter-spacing: 0.02em; }
      .panel { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .frame { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.14); stroke-width: 2; }
      .goodBox { fill: none; stroke: rgba(34,197,94,0.95); stroke-width: 2.5; }
      .badBox { fill: none; stroke: rgba(239,68,68,0.95); stroke-width: 2.5; stroke-dasharray: 6 6; }
      .label { font-size: 12px; font-weight: 800; fill: rgba(255,255,255,0.92); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.62); }
      .arrow { stroke: rgba(255,255,255,0.78); stroke-width: 2.2; fill: none; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    ]]></style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,0.78)"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <text class="h1" x="400" y="40" text-anchor="middle">ADVERSARIAL PATCH (YOLO-STYLE DETECTOR)</text>

    <!-- Left: normal -->
    <g transform="translate(50,70)" filter="url(#shadow)">
      <rect class="panel" x="0" y="0" width="300" height="200" rx="18"/>
      <text class="label" x="20" y="30">Normal</text>
      <rect class="frame" x="20" y="44" width="260" height="136" rx="14"/>

      <!-- simple street scene -->
      <rect x="20" y="140" width="260" height="40" rx="0" fill="rgba(255,255,255,0.04)"/>

      <!-- stop sign -->
      <g transform="translate(210,112)">
        <path d="M -22 -10 L -10 -22 L 10 -22 L 22 -10 L 22 10 L 10 22 L -10 22 L -22 10 Z" fill="rgba(239,68,68,0.85)" stroke="rgba(255,255,255,0.90)" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">STOP</text>
      </g>

      <!-- detection box + label -->
      <rect class="goodBox" x="176" y="78" width="70" height="70" rx="10"/>
      <rect x="176" y="58" width="108" height="18" rx="8" fill="rgba(34,197,94,0.25)" stroke="rgba(34,197,94,0.85)" stroke-width="1.5"/>
      <text class="muted" x="230" y="71" text-anchor="middle" fill="rgba(255,255,255,0.86)">STOP 0.98</text>
    </g>

    <!-- Arrow -->
    <path class="arrow" d="M 380 170 H 420" marker-end="url(#arrowHead)"/>

    <!-- Right: patched -->
    <g transform="translate(450,70)" filter="url(#shadow)">
      <rect class="panel" x="0" y="0" width="300" height="200" rx="18"/>
      <text class="label" x="20" y="30">With patch</text>
      <rect class="frame" x="20" y="44" width="260" height="136" rx="14"/>

      <!-- street -->
      <rect x="20" y="140" width="260" height="40" rx="0" fill="rgba(255,255,255,0.04)"/>

      <!-- stop sign with patch -->
      <g transform="translate(210,112)">
        <path d="M -22 -10 L -10 -22 L 10 -22 L 22 -10 L 22 10 L 10 22 L -10 22 L -22 10 Z" fill="rgba(239,68,68,0.85)" stroke="rgba(255,255,255,0.90)" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">STOP</text>
        <!-- patch sticker -->
        <rect x="-6" y="-2" width="14" height="14" rx="3" fill="rgba(245,158,11,0.85)" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
        <path class="iconStroke" d="M -2 6 L 6 -2" opacity="0.9"/>
      </g>

      <!-- failed detection -->
      <rect class="badBox" x="176" y="78" width="70" height="70" rx="10"/>
      <rect x="176" y="58" width="122" height="18" rx="8" fill="rgba(239,68,68,0.22)" stroke="rgba(239,68,68,0.85)" stroke-width="1.5"/>
      <text class="muted" x="237" y="71" text-anchor="middle" fill="rgba(255,255,255,0.86)">missed / wrong</text>

      <!-- red X -->
      <path class="iconStroke" d="M 176 78 L 246 148 M 246 78 L 176 148" stroke="rgba(239,68,68,0.9)" stroke-width="3"/>
    </g>
  </g>
</svg>
