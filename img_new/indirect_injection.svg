<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Indirect prompt injection flow</title>
  <desc id="desc">Infographic flow: attacker hides instructions in a document, user asks LLM to summarize, LLM performs unauthorized action.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 16px; font-weight: 900; fill: #ffffff; letter-spacing: 0.02em; }
      .node { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .attacker { stroke: #ef4444; }
      .llm { stroke: #44AFF6; }
      .danger { stroke: #ef4444; }
      .label { font-size: 12.5px; font-weight: 700; fill: rgba(255,255,255,0.92); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.62); }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.75); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow { stroke: rgba(255,255,255,0.78); stroke-width: 2.2; fill: none; }
    ]]></style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,0.78)"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <text class="h1" x="400" y="42" text-anchor="middle">INDIRECT PROMPT INJECTION (DOCUMENT / RAG)</text>

    <!-- Nodes row -->
    <g filter="url(#shadow)">
      <!-- Attacker -->
      <g transform="translate(40,88)">
        <rect class="node attacker" x="0" y="0" width="120" height="72" rx="16"/>
        <g transform="translate(22,36)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M -6 2 L -1 -4 L 2 3 L 6 -2"/>
        </g>
        <text class="label" x="70" y="40" text-anchor="middle">Attacker</text>
      </g>

      <!-- Document -->
      <g transform="translate(200,88)">
        <rect class="node" x="0" y="0" width="150" height="72" rx="16"/>
        <g transform="translate(22,36)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M -5 -7 H 2 L 6 -3 V 7 H -5 Z M 2 -7 V -3 H 6"/>
        </g>
        <text class="label" x="92" y="33" text-anchor="middle">Document</text>
        <text class="muted" x="92" y="52" text-anchor="middle">hidden instructions</text>
      </g>

      <!-- User request -->
      <g transform="translate(390,88)">
        <rect class="node" x="0" y="0" width="190" height="72" rx="16"/>
        <g transform="translate(22,36)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M -6 2 H 6 M -6 -2 H 2"/>
        </g>
        <text class="label" x="116" y="33" text-anchor="middle">User asks LLM</text>
        <text class="muted" x="116" y="52" text-anchor="middle">“Summarize this”</text>
      </g>

      <!-- LLM -->
      <g transform="translate(620,88)">
        <rect class="node llm" x="0" y="0" width="90" height="72" rx="16"/>
        <g transform="translate(22,36)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>
        <text class="label" x="56" y="43" text-anchor="middle">LLM</text>
      </g>

      <!-- Output -->
      <g transform="translate(520,186)">
        <rect class="node danger" x="0" y="0" width="190" height="72" rx="16"/>
        <g transform="translate(22,36)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M 0 -7 L 7 7 H -7 Z"/>
        </g>
        <text class="label" x="118" y="33" text-anchor="middle">Unauthorized action</text>
        <text class="muted" x="118" y="52" text-anchor="middle">(exfiltration, phishing)</text>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 160 124 H 200" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 350 124 H 390" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 580 124 H 620" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 665 160 V 186" marker-end="url(#arrowHead)"/>
    </g>
  </g>
</svg>
