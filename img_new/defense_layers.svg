<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">Defense-in-depth layers</title>
  <desc id="desc">Concentric defense-in-depth rings: Monitoring, Deployment safeguards, Model hardening, Data validation, center AI system. Includes simple icons.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .ring { stroke-width: 2; }
      .label { fill: rgba(255,255,255,0.92); font-weight: 800; font-size: 12px; }
      .labelSmall { fill: rgba(255,255,255,0.78); font-weight: 700; font-size: 11px; }
      .center { fill: #ffffff; font-weight: 900; font-size: 14px; letter-spacing: 0.03em; }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.70); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rings -->
  <g filter="url(#shadow)">
    <circle class="ring" cx="300" cy="250" r="230" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.70)"/>
    <circle class="ring" cx="300" cy="250" r="175" fill="rgba(68,175,246,0.16)" stroke="rgba(68,175,246,0.70)"/>
    <circle class="ring" cx="300" cy="250" r="120" fill="rgba(251,146,60,0.16)" stroke="rgba(251,146,60,0.72)"/>
    <circle class="ring" cx="300" cy="250" r="75" fill="rgba(239,68,68,0.14)" stroke="rgba(239,68,68,0.72)"/>
    <circle cx="300" cy="250" r="42" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.30)" stroke-width="2"/>
  </g>

  <!-- Labels + icons -->
  <g class="font">
    <!-- Monitoring -->
    <g transform="translate(300,46)">
      <circle class="iconCircle" cx="0" cy="0" r="14"/>
      <!-- eye -->
      <path class="iconStroke" d="M -9 0 Q 0 -8 9 0 Q 0 8 -9 0 Z"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff"/>
    </g>
    <text class="label" x="300" y="78" text-anchor="middle">Monitoring &amp; Incident Response</text>

    <!-- Deployment -->
    <g transform="translate(468,250)">
      <circle class="iconCircle" cx="0" cy="0" r="14"/>
      <!-- gate -->
      <path class="iconStroke" d="M -7 -6 V 6 M 7 -6 V 6 M -7 -2 H 7 M -7 2 H 7"/>
    </g>
    <text class="label" x="468" y="286" text-anchor="middle">Deployment safeguards</text>

    <!-- Model hardening -->
    <g transform="translate(300,372)">
      <circle class="iconCircle" cx="0" cy="0" r="14"/>
      <!-- shield -->
      <path class="iconStroke" d="M 0 -9 L 8 -5 L 7 5 C 5 9 2 12 0 13 C -2 12 -5 9 -7 5 L -8 -5 Z"/>
    </g>
    <text class="label" x="300" y="408" text-anchor="middle">Model hardening</text>

    <!-- Data validation -->
    <g transform="translate(210,210)">
      <circle class="iconCircle" cx="0" cy="0" r="14"/>
      <!-- database check -->
      <ellipse cx="0" cy="-5" rx="7" ry="3.2" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path class="iconStroke" d="M -7 -5 V 6 C -7 8 7 8 7 6 V -5"/>
      <path class="iconStroke" d="M 2 2 L 4 4 L 8 -1"/>
    </g>
    <text class="labelSmall" x="210" y="244" text-anchor="middle">Data validation</text>

    <!-- Center -->
    <g transform="translate(300,250)">
      <!-- chip -->
      <rect x="-10" y="-10" width="20" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path class="iconStroke" d="M -16 -6 H -10 M -16 0 H -10 M -16 6 H -10 M 10 -6 H 16 M 10 0 H 16 M 10 6 H 16"/>
    </g>
    <text class="center" x="300" y="292" text-anchor="middle">AI SYSTEM</text>
  </g>
</svg>
