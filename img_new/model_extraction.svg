<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Model extraction flow</title>
  <desc id="desc">Infographic: attacker queries a target model API, builds a shadow dataset, trains a high-fidelity clone.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 16px; font-weight: 900; fill: #ffffff; letter-spacing: 0.02em; }
      .node { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .attacker { stroke: #ef4444; }
      .api { stroke: #44AFF6; }
      .dataset { stroke: rgba(255,255,255,0.30); }
      .clone { stroke: #fb923c; }
      .label { font-size: 12.5px; font-weight: 800; fill: rgba(255,255,255,0.92); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.62); }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.75); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow { stroke: rgba(255,255,255,0.78); stroke-width: 2.2; fill: none; }
    ]]></style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,0.78)"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <text class="h1" x="400" y="42" text-anchor="middle">MODEL EXTRACTION</text>

    <g filter="url(#shadow)">
      <!-- Attacker -->
      <g transform="translate(50,92)">
        <rect class="node attacker" x="0" y="0" width="150" height="78" rx="16"/>
        <g transform="translate(22,39)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M -6 2 L -1 -4 L 2 3 L 6 -2"/>
        </g>
        <text class="label" x="92" y="42" text-anchor="middle">Attacker</text>
        <text class="muted" x="92" y="62" text-anchor="middle">crafted queries</text>
      </g>

      <!-- Target API -->
      <g transform="translate(250,92)">
        <rect class="node api" x="0" y="0" width="170" height="78" rx="16"/>
        <g transform="translate(22,39)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <!-- plug -->
          <path class="iconStroke" d="M -4 -3 V -9 M 4 -3 V -9 M -7 -3 H 7 M 0 -3 V 7"/>
        </g>
        <text class="label" x="108" y="36" text-anchor="middle">Target model</text>
        <text class="muted" x="108" y="56" text-anchor="middle">API endpoint</text>
      </g>

      <!-- Shadow dataset -->
      <g transform="translate(470,92)">
        <rect class="node dataset" x="0" y="0" width="170" height="78" rx="16"/>
        <g transform="translate(22,39)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <!-- database -->
          <ellipse cx="0" cy="-5" rx="7" ry="3.2" fill="none" stroke="#ffffff" stroke-width="2"/>
          <path class="iconStroke" d="M -7 -5 V 6 C -7 8 7 8 7 6 V -5"/>
          <ellipse cx="0" cy="6" rx="7" ry="3.2" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>
        <text class="label" x="108" y="36" text-anchor="middle">Shadow dataset</text>
        <text class="muted" x="108" y="56" text-anchor="middle">input → output pairs</text>
      </g>

      <!-- Clone model -->
      <g transform="translate(660,92)">
        <rect class="node clone" x="0" y="0" width="120" height="78" rx="16"/>
        <g transform="translate(22,39)">
          <circle class="iconCircle" cx="0" cy="0" r="12"/>
          <path class="iconStroke" d="M -6 -4 L 0 -8 L 6 -4 L 0 0 Z M -6 -4 V 4 L 0 8 L 0 0 M 6 -4 V 4 L 0 8"/>
        </g>
        <text class="label" x="76" y="36" text-anchor="middle">Clone</text>
        <text class="muted" x="76" y="56" text-anchor="middle">&gt;95% fidelity</text>
      </g>

      <!-- Arrows + captions -->
      <path class="arrow" d="M 200 131 H 250" marker-end="url(#arrowHead)"/>
      <text class="muted" x="225" y="120" text-anchor="middle">queries</text>

      <path class="arrow" d="M 420 131 H 470" marker-end="url(#arrowHead)"/>
      <text class="muted" x="445" y="120" text-anchor="middle">responses</text>

      <path class="arrow" d="M 640 131 H 660" marker-end="url(#arrowHead)"/>
      <text class="muted" x="650" y="120" text-anchor="end">train</text>
    </g>

    <text class="muted" x="400" y="260" text-anchor="middle">Goal: replicate behavior without access to weights or training data</text>
  </g>
</svg>
