<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
  <title id="title">LLM hallucination types</title>
  <desc id="desc">Three-card infographic: wrong recall, wrong knowledge, and fabrication.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 900; fill: #ffffff; letter-spacing: 0.02em; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .a { stroke: #fb923c; }
      .b { stroke: #f59e0b; }
      .c { stroke: #ef4444; }
      .t1 { font-size: 13.5px; font-weight: 900; fill: #ffffff; }
      .t2 { font-size: 12px; font-weight: 600; fill: rgba(255,255,255,0.78); }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.75); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <text class="h1" x="350" y="38" text-anchor="middle">LLM HALLUCINATION TYPES</text>

    <!-- Card A -->
    <g transform="translate(30,70)" filter="url(#shadow)">
      <rect class="card a" x="0" y="0" width="200" height="200" rx="18"/>
      <g transform="translate(24,36)">
        <circle class="iconCircle" cx="0" cy="0" r="12"/>
        <!-- memory icon -->
        <path class="iconStroke" d="M -6 2 C -6 -4 6 -4 6 2 C 6 6 2 8 0 10 C -2 8 -6 6 -6 2 Z"/>
      </g>
      <text class="t1" x="24" y="68">Type A</text>
      <text class="t2" x="24" y="88">Wrong recall</text>
      <text class="t2" x="24" y="126">Incorrect memory of</text>
      <text class="t2" x="24" y="146">training data</text>
    </g>

    <!-- Card B -->
    <g transform="translate(250,70)" filter="url(#shadow)">
      <rect class="card b" x="0" y="0" width="200" height="200" rx="18"/>
      <g transform="translate(24,36)">
        <circle class="iconCircle" cx="0" cy="0" r="12"/>
        <!-- book icon -->
        <path class="iconStroke" d="M -6 -7 H 0 C 3 -7 6 -5 6 -2 V 7 H 0 C -3 7 -6 5 -6 2 Z"/>
        <path class="iconStroke" d="M 0 -7 V 7"/>
      </g>
      <text class="t1" x="24" y="68">Type B</text>
      <text class="t2" x="24" y="88">Wrong knowledge</text>
      <text class="t2" x="24" y="126">Errors in the training</text>
      <text class="t2" x="24" y="146">data itself</text>
    </g>

    <!-- Card C -->
    <g transform="translate(470,70)" filter="url(#shadow)">
      <rect class="card c" x="0" y="0" width="200" height="200" rx="18"/>
      <g transform="translate(24,36)">
        <circle class="iconCircle" cx="0" cy="0" r="12"/>
        <!-- spark icon -->
        <path class="iconStroke" d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z"/>
      </g>
      <text class="t1" x="24" y="68">Type C</text>
      <text class="t2" x="24" y="88">Fabrication</text>
      <text class="t2" x="24" y="126">No basis in training</text>
      <text class="t2" x="24" y="146">data at all</text>
    </g>
  </g>
</svg>
