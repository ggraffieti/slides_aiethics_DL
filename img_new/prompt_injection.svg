<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Prompt injection: direct vs indirect</title>
  <desc id="desc">Two-panel infographic comparing direct and indirect prompt injection attack paths.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 900; fill: #ffffff; letter-spacing: 0.03em; }
      .h2 { font-size: 14px; font-weight: 800; fill: #ffffff; }
      .body { font-size: 12.5px; font-weight: 600; fill: rgba(255,255,255,0.86); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.60); }
      .panel { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .node { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .danger { stroke: #ef4444; }
      .llm { stroke: #44AFF6; }
      .attacker { stroke: #ef4444; }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.75); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow { stroke: rgba(255,255,255,0.78); stroke-width: 2.2; fill: none; }
    ]]></style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,0.78)"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <text class="h1" x="450" y="34" text-anchor="middle">PROMPT INJECTION</text>
    <text class="muted" x="450" y="54" text-anchor="middle">Direct vs Indirect (via documents / RAG)</text>

    <!-- Left panel: direct -->
    <g transform="translate(40,78)" filter="url(#shadow)">
      <rect class="panel" x="0" y="0" width="400" height="290" rx="18"/>
      <text class="h2" x="24" y="34">Direct injection</text>
      <text class="muted" x="24" y="54">Attacker writes the prompt</text>

      <!-- Nodes -->
      <g transform="translate(24,88)">
        <rect class="node attacker" x="0" y="0" width="110" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <path class="iconStroke" d="M -6 2 L -1 -4 L 2 3 L 6 -2"/>
        </g>
        <text class="body" x="68" y="32" text-anchor="middle">Attacker</text>
      </g>

      <g transform="translate(160,88)">
        <rect class="node" x="0" y="0" width="120" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <path class="iconStroke" d="M -5 -3 H 5 M -5 1 H 3 M -5 5 H 1"/>
        </g>
        <text class="body" x="72" y="25" text-anchor="middle">Malicious</text>
        <text class="muted" x="72" y="42" text-anchor="middle">prompt</text>
      </g>

      <g transform="translate(306,88)">
        <rect class="node llm" x="0" y="0" width="70" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>
        <text class="body" x="46" y="33" text-anchor="middle">LLM</text>
      </g>

      <g transform="translate(220,174)">
        <rect class="node danger" x="0" y="0" width="156" height="54" rx="14"/>
        <g transform="translate(20,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <path class="iconStroke" d="M 0 -6 L 6 6 H -6 Z"/>
        </g>
        <text class="body" x="98" y="32" text-anchor="middle">Harmful output</text>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 134 115 H 160" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 280 115 H 306" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 341 142 V 174" marker-end="url(#arrowHead)"/>
    </g>

    <!-- Right panel: indirect -->
    <g transform="translate(460,78)" filter="url(#shadow)">
      <rect class="panel" x="0" y="0" width="400" height="290" rx="18"/>
      <text class="h2" x="24" y="34">Indirect injection</text>
      <text class="muted" x="24" y="54">Attacker hides instructions in retrieved content</text>

      <!-- Nodes -->
      <g transform="translate(24,88)">
        <rect class="node attacker" x="0" y="0" width="110" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <path class="iconStroke" d="M -6 2 L -1 -4 L 2 3 L 6 -2"/>
        </g>
        <text class="body" x="68" y="32" text-anchor="middle">Attacker</text>
      </g>

      <g transform="translate(160,88)">
        <rect class="node" x="0" y="0" width="150" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <!-- document icon -->
          <path class="iconStroke" d="M -5 -6 H 2 L 6 -2 V 6 H -5 Z M 2 -6 V -2 H 6"/>
        </g>
        <text class="body" x="88" y="25" text-anchor="middle">Document</text>
        <text class="muted" x="88" y="42" text-anchor="middle">(hidden instructions)</text>
      </g>

      <g transform="translate(24,174)">
        <rect class="node" x="0" y="0" width="286" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <path class="iconStroke" d="M -5 2 H 5 M -5 -2 H 3"/>
        </g>
        <text class="body" x="172" y="32" text-anchor="middle">User asks LLM to summarize</text>
      </g>

      <g transform="translate(326,174)">
        <rect class="node llm" x="0" y="0" width="70" height="54" rx="14"/>
        <g transform="translate(18,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>
        <text class="body" x="46" y="33" text-anchor="middle">LLM</text>
      </g>

      <g transform="translate(240,240)">
        <rect class="node danger" x="0" y="0" width="156" height="54" rx="14"/>
        <g transform="translate(20,27)">
          <circle class="iconCircle" cx="0" cy="0" r="10"/>
          <path class="iconStroke" d="M 0 -6 L 6 6 H -6 Z"/>
        </g>
        <text class="body" x="98" y="25" text-anchor="middle">Unsafe action</text>
        <text class="muted" x="98" y="42" text-anchor="middle">(exfiltration, phishing)</text>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 134 115 H 160" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 235 142 V 174" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 310 201 H 326" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 361 228 V 240" marker-end="url(#arrowHead)"/>
    </g>
  </g>
</svg>
