<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">EU AI Act risk pyramid</title>
  <desc id="desc">Four-tier EU AI Act risk pyramid with simple icons: Prohibited, High risk, Limited risk, Minimal risk.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .tier { stroke-width: 2; stroke-linejoin: round; }
      .t1 { font-size: 22px; font-weight: 800; letter-spacing: 0.05em; fill: #ffffff; text-anchor: middle; }
      .t2 { font-size: 13px; font-weight: 500; fill: rgba(255,255,255,0.86); text-anchor: middle; }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.85); stroke-width: 2.2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .muted { fill: rgba(255,255,255,0.55); font-size: 11px; }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Pyramid tiers (transparent background; designed for black slides) -->
  <g filter="url(#shadow)">
    <!-- Minimal risk -->
    <polygon class="tier" points="150,460 650,460 580,350 220,350" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e"/>
    <!-- Limited risk -->
    <polygon class="tier" points="220,350 580,350 530,240 270,240" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b"/>
    <!-- High risk -->
    <polygon class="tier" points="270,240 530,240 480,140 320,140" fill="#fb923c" fill-opacity="0.22" stroke="#fb923c"/>
    <!-- Prohibited -->
    <polygon class="tier" points="320,140 480,140 440,60 360,60" fill="#ef4444" fill-opacity="0.22" stroke="#ef4444"/>
  </g>

  <!-- Labels + icons -->
  <g class="font">
    <!-- PROHIBITED -->
    <g transform="translate(400, 0)">
      <g transform="translate(0, 82)">
        <circle class="iconCircle" cx="0" cy="0" r="15"/>
        <circle class="iconStroke" cx="0" cy="0" r="11"/>
        <line class="iconStroke" x1="-8" y1="8" x2="8" y2="-8"/>
      </g>
      <text class="t1" x="0" y="110">PROHIBITED</text>
      <text class="t2" x="0" y="130">Social scoring, manipulation,</text>
      <text class="t2" x="0" y="146">mass biometric surveillance</text>
    </g>

    <!-- HIGH RISK -->
    <g transform="translate(400, 0)">
      <g transform="translate(0, 164)">
        <circle class="iconCircle" cx="0" cy="0" r="15"/>
        <line class="iconStroke" x1="0" y1="-7" x2="0" y2="4"/>
        <circle cx="0" cy="9" r="1.8" fill="#ffffff"/>
      </g>
      <text class="t1" x="0" y="196">HIGH RISK</text>
      <text class="t2" x="0" y="216">Healthcare, road traffic, ADS,</text>
      <text class="t2" x="0" y="232">hiring, law enforcement</text>
    </g>

    <!-- LIMITED RISK -->
    <g transform="translate(400, 0)">
      <g transform="translate(0, 264)">
        <circle class="iconCircle" cx="0" cy="0" r="15"/>
        <line class="iconStroke" x1="0" y1="-3" x2="0" y2="8"/>
        <circle cx="0" cy="-8" r="1.8" fill="#ffffff"/>
      </g>
      <text class="t1" x="0" y="296">LIMITED RISK</text>
      <text class="t2" x="0" y="316">Transparency obligations</text>
      <text class="t2" x="0" y="332">(chatbots, deepfakes)</text>
    </g>

    <!-- MINIMAL RISK -->
    <g transform="translate(400, 0)">
      <g transform="translate(0, 374)">
        <circle class="iconCircle" cx="0" cy="0" r="15"/>
        <path class="iconStroke" d="M -7 0 L -2 6 L 8 -6"/>
      </g>
      <text class="t1" x="0" y="410">MINIMAL RISK</text>
      <text class="t2" x="0" y="430">Spam filters, AI in games</text>
    </g>
  </g>
</svg>
