<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">FGSM adversarial example diagram</title>
  <desc id="desc">Three-card infographic: original image plus small perturbation equals adversarial image with changed prediction.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .label { font-size: 14px; font-weight: 800; fill: #ffffff; letter-spacing: 0.02em; }
      .sub { font-size: 12px; font-weight: 600; fill: rgba(255,255,255,0.82); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .danger { stroke: #ef4444; }
      .op { font-size: 30px; font-weight: 300; fill: rgba(255,255,255,0.92); }
      .muted { font-size: 11px; fill: rgba(255,255,255,0.60); font-style: italic; }
      .iconCircle { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.75); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    ]]></style>
    <pattern id="noise" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="rgba(255,255,255,0.02)"/>
      <circle cx="2" cy="3" r="0.8" fill="rgba(255,255,255,0.35)"/>
      <circle cx="6" cy="2" r="0.6" fill="rgba(255,255,255,0.28)"/>
      <circle cx="5" cy="6" r="0.7" fill="rgba(255,255,255,0.30)"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font" transform="translate(40,28)">
    <!-- Card 1: Original -->
    <g filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="200" height="190" rx="16"/>
      <g transform="translate(20,24)">
        <circle class="iconCircle" cx="0" cy="0" r="12"/>
        <!-- simple “image” icon -->
        <rect x="-6" y="-5" width="12" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        <path class="iconStroke" d="M -5 3 L -1 0 L 2 2 L 6 -2"/>
      </g>
      <text class="label" x="24" y="30">Original</text>
      <text class="sub" x="24" y="50">Panda (99.3%)</text>

      <!-- placeholder image panel -->
      <rect x="24" y="66" width="152" height="92" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
      <path d="M 38 140 L 78 108 L 102 126 L 138 96 L 164 140 Z" fill="rgba(255,255,255,0.16)"/>
      <circle cx="62" cy="96" r="10" fill="rgba(255,255,255,0.14)"/>
    </g>

    <!-- + -->
    <text class="op" x="225" y="110" text-anchor="middle">+</text>

    <!-- Card 2: Perturbation -->
    <g transform="translate(250,0)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="200" height="190" rx="16"/>
      <g transform="translate(20,24)">
        <circle class="iconCircle" cx="0" cy="0" r="12"/>
        <!-- “noise” icon -->
        <path class="iconStroke" d="M -7 2 L -3 -2 L 0 3 L 3 -1 L 7 2"/>
      </g>
      <text class="label" x="24" y="30">Perturbation</text>
      <text class="sub" x="24" y="50">? · sign(??J)</text>

      <rect x="24" y="66" width="152" height="92" rx="10" fill="url(#noise)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
      <rect x="24" y="66" width="152" height="92" rx="10" fill="rgba(255,255,255,0.02)"/>
    </g>

    <!-- = -->
    <text class="op" x="475" y="110" text-anchor="middle">=</text>

    <!-- Card 3: Adversarial -->
    <g transform="translate(500,0)" filter="url(#shadow)">
      <rect class="card danger" x="0" y="0" width="200" height="190" rx="16"/>
      <g transform="translate(20,24)">
        <circle class="iconCircle" cx="0" cy="0" r="12"/>
        <!-- warning icon -->
        <path class="iconStroke" d="M 0 -7 L 7 6 H -7 Z"/>
        <line class="iconStroke" x1="0" y1="-2" x2="0" y2="2"/>
        <circle cx="0" cy="5" r="1.4" fill="#ffffff"/>
      </g>
      <text class="label" x="24" y="30">Adversarial</text>
      <text class="sub" x="24" y="50" fill="rgba(255,255,255,0.86)">Gibbon (99.7%)</text>

      <rect x="24" y="66" width="152" height="92" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
      <path d="M 38 140 L 78 108 L 102 126 L 138 96 L 164 140 Z" fill="rgba(255,255,255,0.16)"/>
      <circle cx="62" cy="96" r="10" fill="rgba(255,255,255,0.14)"/>
      <!-- subtle red overlay corner -->
      <path d="M 24 66 L 70 66 L 24 112 Z" fill="rgba(239,68,68,0.18)"/>
    </g>

    <text class="muted" x="360" y="230" text-anchor="middle">Key idea: tiny input changes can flip predictions</text>
  </g>
</svg>
