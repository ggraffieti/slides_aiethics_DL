<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Digital vs physical adversarial attacks on a stop sign</title>
  <desc id="desc">Two-column diagram comparing digital adversarial perturbations bounded by epsilon with physical sticker or patch attacks that must survive real-world transformations and the camera pipeline.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11.6px; fill: rgba(255,255,255,0.92); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ev { stroke: #ef4444; }
      .evFill { fill: rgba(239,68,68,0.18); }
      .po { stroke: #fb923c; }
      .poFill { fill: rgba(251,146,60,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="240" y="18" width="520" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">ADVERSARIAL EXAMPLES: DIGITAL vs PHYSICAL</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Physical attacks must survive transforms, sensors, and the world</text>
    </g>

    <!-- Two columns -->
    <g transform="translate(60,110)">
      <!-- Digital -->
      <g filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="420" height="320" rx="18"/>
        <rect class="evFill" x="0" y="0" width="420" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="420" y2="58"/>
        <text class="h2" x="20" y="36">Digital perturbation</text>
        <text class="muted" x="20" y="54">epsilon-bounded input change</text>

        <!-- Stop sign glyph -->
        <g transform="translate(80,110)">
          <path d="M 90 0 L 140 20 L 160 70 L 140 120 L 90 140 L 40 120 L 20 70 L 40 20 Z"
                fill="rgba(239,68,68,0.75)" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
          <text x="90" y="82" text-anchor="middle" style="font-size:28px;font-weight:900;fill:#ffffff">STOP</text>

          <!-- Pixel noise overlay -->
          <g opacity="0.45">
            <rect x="45" y="38" width="8" height="8" fill="rgba(255,255,255,0.28)"/>
            <rect x="110" y="28" width="6" height="6" fill="rgba(255,255,255,0.22)"/>
            <rect x="122" y="94" width="7" height="7" fill="rgba(255,255,255,0.22)"/>
            <rect x="70" y="98" width="6" height="6" fill="rgba(255,255,255,0.18)"/>
            <rect x="96" y="54" width="5" height="5" fill="rgba(255,255,255,0.16)"/>
          </g>
        </g>

        <g transform="translate(20,250)">
          <text class="mono" x="0" y="0">x_adv = x + delta,  ||delta|| &lt;= eps</text>
          <text class="body" x="0" y="30">- optimized to flip the prediction</text>
          <text class="body" x="0" y="56">- often transfers across models</text>
        </g>
      </g>

      <!-- Physical -->
      <g transform="translate(460,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="420" height="320" rx="18"/>
        <rect class="poFill" x="0" y="0" width="420" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="420" y2="58"/>
        <text class="h2" x="20" y="36">Physical patch / sticker</text>
        <text class="muted" x="20" y="54">must survive real-world conditions</text>

        <!-- Stop sign with sticker -->
        <g transform="translate(80,110)">
          <path d="M 90 0 L 140 20 L 160 70 L 140 120 L 90 140 L 40 120 L 20 70 L 40 20 Z"
                fill="rgba(239,68,68,0.75)" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
          <text x="90" y="82" text-anchor="middle" style="font-size:28px;font-weight:900;fill:#ffffff">STOP</text>
          <!-- Sticker patch -->
          <rect x="120" y="88" width="30" height="22" rx="4" fill="rgba(251,146,60,0.65)" stroke="rgba(255,255,255,0.70)" stroke-width="2"/>
        </g>

        <g transform="translate(20,250)">
          <text class="body" x="0" y="0">Constraints include:</text>
          <text class="body" x="0" y="28">- viewpoint, distance, lighting, weather</text>
          <text class="body" x="0" y="54">- camera pipeline (ISP, blur, compression)</text>
          <text class="body" x="0" y="80">- multi-sensor fusion and redundancy</text>
        </g>
      </g>
    </g>
  </g>
</svg>

