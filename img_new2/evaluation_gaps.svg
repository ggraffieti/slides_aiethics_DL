<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation gaps in adversarial ML</title>
  <desc id="desc">Diagram showing the gap between benchmark testing and real-world deployment, and the complementary roles of red-teaming, monitoring, and formal guarantees.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .circleA { fill: rgba(68,175,246,0.14); stroke: rgba(68,175,246,0.70); stroke-width: 2.4; }
      .circleB { fill: rgba(245,158,11,0.12); stroke: rgba(245,158,11,0.70); stroke-width: 2.4; }
      .gap { fill: rgba(239,68,68,0.14); stroke: rgba(239,68,68,0.75); stroke-width: 2.4; stroke-dasharray: 6 6; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="250" y="18" width="500" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">EVALUATION GAPS</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Empirical tests miss shifted and adversarial distributions</text>
    </g>

    <!-- Venn-like view -->
    <g transform="translate(70,100)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="860" height="270" rx="18"/>

      <circle class="circleA" cx="330" cy="140" r="120"/>
      <circle class="circleB" cx="520" cy="140" r="120"/>

      <!-- Gap highlight -->
      <ellipse class="gap" cx="425" cy="150" rx="70" ry="95"/>
      <text class="h2" x="425" y="145" text-anchor="middle">Gap</text>
      <text class="muted" x="425" y="164" text-anchor="middle">adversary + shift</text>

      <text class="h2" x="270" y="70" text-anchor="middle">Benchmarks</text>
      <text class="muted" x="270" y="90" text-anchor="middle">clean, i.i.d. tests</text>

      <text class="h2" x="590" y="70" text-anchor="middle">Deployment</text>
      <text class="muted" x="590" y="90" text-anchor="middle">open world</text>

      <g transform="translate(70,220)">
        <text class="body" x="0" y="0">- distribution shift (weather, geography, sensors)</text>
        <text class="body" x="0" y="28">- adaptive attackers (poisoning, triggers, spoofing)</text>
        <text class="body" x="0" y="56">- system cascades (perception -&gt; planning -&gt; control)</text>
      </g>
    </g>

    <!-- Complementary strategies -->
    <g transform="translate(70,388)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="860" height="46" rx="16"/>
      <text class="body" x="18" y="30">Mitigate the gap with: red-teaming + threat-model tests + runtime monitoring + (limited) formal guarantees.</text>
    </g>

    <path class="arrow" d="M 930 235 L 980 235" marker-end="url(#arrowHead)"/>
  </g>
</svg>

