<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Threat model matrix for machine learning</title>
  <desc id="desc">Diagram showing how to specify an ML threat model using adversary knowledge, capabilities, and security goals, plus a mapping to training-time, inference-time, and query-time threats.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.6px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.4px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }

      .k { stroke: #44AFF6; }
      .kFill { fill: rgba(68,175,246,0.18); }
      .c { stroke: #fb923c; }
      .cFill { fill: rgba(251,146,60,0.18); }
      .g { stroke: #22c55e; }
      .gFill { fill: rgba(34,197,94,0.18); }

      .tag { font-size: 10.8px; font-weight: 800; letter-spacing: 0.08em; fill: rgba(255,255,255,0.86); }
      .small { font-size: 11px; fill: rgba(255,255,255,0.72); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.85)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="220" y="22" width="560" height="58" rx="14"/>
      <text class="h1" x="500" y="54" text-anchor="middle">THREAT MODEL = (KNOWLEDGE, CAPABILITY, GOAL)</text>
      <text class="muted" x="500" y="72" text-anchor="middle">Define access first; then pick attacks and defenses that match it</text>
    </g>

    <!-- Three cards -->
    <g transform="translate(60,110)">
      <!-- KNOWLEDGE -->
      <g filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="270" height="250" rx="18"/>
        <rect class="kFill" x="0" y="0" width="270" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="270" y2="58"/>
        <!-- icon: eye -->
        <g transform="translate(28,30)">
          <path class="iconStroke k" d="M -14 0 C -8 -10 8 -10 14 0 C 8 10 -8 10 -14 0 Z"/>
          <circle cx="0" cy="0" r="3.4" fill="#ffffff"/>
        </g>
        <text class="h2" x="58" y="36">Knowledge</text>
        <text class="muted" x="58" y="53">What the attacker knows</text>

        <g transform="translate(20,92)">
          <text class="body" x="0" y="0">- Black-box: API I/O only</text>
          <text class="body" x="0" y="28">- Gray-box: partial internals</text>
          <text class="body" x="0" y="56">- White-box: weights/gradients</text>
          <text class="muted" x="0" y="88">Impacts: attack strength, transferability</text>
        </g>
      </g>

      <!-- CAPABILITIES -->
      <g transform="translate(305,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="270" height="250" rx="18"/>
        <rect class="cFill" x="0" y="0" width="270" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="270" y2="58"/>
        <!-- icon: hand -->
        <g transform="translate(28,30)">
          <path class="iconStroke c" d="M -8 10 V -2 C -8 -6 -3 -6 -3 -2 V 6"/>
          <path class="iconStroke c" d="M -3 6 V -6 C -3 -10 2 -10 2 -6 V 6"/>
          <path class="iconStroke c" d="M 2 6 V -4 C 2 -8 7 -8 7 -4 V 6"/>
          <path class="iconStroke c" d="M 7 6 V -1 C 7 -4 11 -4 11 -1 V 7 C 11 13 6 16 0 16 C -6 16 -10 13 -10 7 V 10"/>
        </g>
        <text class="h2" x="58" y="36">Capabilities</text>
        <text class="muted" x="58" y="53">What the attacker can change</text>

        <g transform="translate(20,92)">
          <text class="body" x="0" y="0">- Query access (rate, outputs)</text>
          <text class="body" x="0" y="28">- Training data / labels access</text>
          <text class="body" x="0" y="56">- Physical access (sensors/signs)</text>
          <text class="body" x="0" y="84">- Supply chain access (models)</text>
        </g>
      </g>

      <!-- GOALS -->
      <g transform="translate(610,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="270" height="250" rx="18"/>
        <rect class="gFill" x="0" y="0" width="270" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="270" y2="58"/>
        <!-- icon: shield -->
        <g transform="translate(28,30)">
          <path class="iconStroke g" d="M 0 -14 L 12 -10 V 0 C 12 10 5 15 0 18 C -5 15 -12 10 -12 0 V -10 Z"/>
          <path class="iconStroke g" d="M 0 -10 V 10"/>
        </g>
        <text class="h2" x="58" y="36">Goals</text>
        <text class="muted" x="58" y="53">What success means (CIA)</text>

        <g transform="translate(20,92)">
          <text class="body" x="0" y="0">- Integrity: wrong outputs/actions</text>
          <text class="body" x="0" y="28">- Availability: degrade / disable</text>
          <text class="body" x="0" y="56">- Confidentiality: extract data/IP</text>
          <text class="muted" x="0" y="88">Pick metrics: targeted error, downtime, leakage</text>
        </g>
      </g>
    </g>

    <!-- Lifecycle mapping -->
    <g transform="translate(90,394)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="820" height="76" rx="18"/>
      <text class="h2" x="20" y="28">Lifecycle mapping</text>
      <text class="muted" x="20" y="48">Same threat model; different leverage points across the ML pipeline</text>

      <g transform="translate(330,20)">
        <rect class="pill" x="0" y="0" width="160" height="40" rx="999"/>
        <text class="tag" x="80" y="26" text-anchor="middle">TRAINING-TIME</text>
        <text class="small" x="170" y="26">Poisoning - Backdoors</text>
        <line class="sep" x1="330" y1="20" x2="430" y2="20" marker-end="url(#arrow)"/>
      </g>

      <g transform="translate(520,20)">
        <rect class="pill" x="0" y="0" width="160" height="40" rx="999"/>
        <text class="tag" x="80" y="26" text-anchor="middle">INFERENCE-TIME</text>
        <text class="small" x="170" y="26">Evasion - Physical spoofing</text>
      </g>

      <g transform="translate(150,20)">
        <rect class="pill" x="0" y="0" width="160" height="40" rx="999"/>
        <text class="tag" x="80" y="26" text-anchor="middle">QUERY-TIME</text>
        <text class="small" x="170" y="26">Extraction - Inversion - Membership</text>
      </g>
    </g>
  </g>
</svg>

