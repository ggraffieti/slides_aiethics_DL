<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Membership inference as hypothesis testing</title>
  <desc id="desc">Diagram presenting membership inference as a hypothesis test using a score such as loss or confidence, showing separated score distributions for members and non-members and a decision threshold.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11.6px; fill: rgba(255,255,255,0.92); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .axis { stroke: rgba(255,255,255,0.55); stroke-width: 2; }
      .grid { stroke: rgba(255,255,255,0.10); stroke-width: 1.2; }
      .member { stroke: #22c55e; stroke-width: 4; fill: rgba(34,197,94,0.12); }
      .non { stroke: #44AFF6; stroke-width: 4; fill: rgba(68,175,246,0.12); }
      .thr { stroke: rgba(255,255,255,0.75); stroke-width: 2.2; stroke-dasharray: 6 6; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="250" y="18" width="500" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">MEMBERSHIP INFERENCE (HYPOTHESIS TEST)</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Was (x,y) in the training set? Decide using a score s(x)</text>
    </g>

    <!-- Left: hypotheses -->
    <g transform="translate(60,120)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="260" height="250" rx="18"/>
      <text class="h2" x="20" y="40">Hypotheses</text>
      <g transform="translate(20,70)">
        <rect class="pill" x="0" y="0" width="220" height="64" rx="16"/>
        <text class="mono" x="18" y="26">H0: (x,y) NOT in D_train</text>
        <text class="muted" x="18" y="48">non-member</text>

        <rect class="pill" x="0" y="86" width="220" height="64" rx="16"/>
        <text class="mono" x="18" y="112">H1: (x,y) in D_train</text>
        <text class="muted" x="18" y="134">member</text>
      </g>
      <text class="muted" x="20" y="226">Common scores:</text>
      <text class="muted" x="20" y="244">loss, confidence, entropy, margin</text>
    </g>

    <!-- Middle: score distributions -->
    <g transform="translate(350,120)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="590" height="250" rx="18"/>
      <text class="h2" x="20" y="40">Score distributions</text>
      <text class="muted" x="20" y="58">If the model overfits, member and non-member scores can separate</text>

      <g transform="translate(70,78)">
        <!-- plot area 470 x 150 -->
        <rect x="0" y="0" width="470" height="150" fill="rgba(0,0,0,0)"/>
        <line class="grid" x1="117.5" y1="0" x2="117.5" y2="150"/>
        <line class="grid" x1="235" y1="0" x2="235" y2="150"/>
        <line class="grid" x1="352.5" y1="0" x2="352.5" y2="150"/>
        <line class="axis" x1="0" y1="150" x2="470" y2="150"/>
        <line class="axis" x1="0" y1="150" x2="0" y2="0"/>

        <!-- Non-member curve (higher loss / lower confidence) -->
        <path class="non" d="M 10 150 C 70 150, 90 90, 140 80 C 200 70, 235 110, 260 150 L 10 150 Z"/>
        <!-- Member curve (lower loss / higher confidence) -->
        <path class="member" d="M 210 150 C 250 150, 280 88, 330 76 C 400 62, 430 108, 460 150 L 210 150 Z"/>

        <!-- Threshold -->
        <line class="thr" x1="240" y1="0" x2="240" y2="150"/>
        <text class="muted" x="240" y="-8" text-anchor="middle">threshold</text>

        <!-- Labels -->
        <text class="body" x="120" y="32">non-member</text>
        <text class="body" x="350" y="28">member</text>
      </g>

      <text class="mono" x="20" y="238">Decision: predict member if s(x) &lt;= tau  (or confidence &gt;= tau)</text>
    </g>

    <!-- Bottom: arrow to decision -->
    <path class="arrow" d="M 500 380 L 780 380" marker-end="url(#arrowHead)"/>
    <text class="muted" x="640" y="370" text-anchor="middle">attack accuracy depends on generalization gap</text>
  </g>
</svg>

