<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Stealthiness versus attack effectiveness trade-off</title>
  <desc id="desc">A chart-like diagram showing a typical trade-off curve between how stealthy a poisoning attack is and how effective it is, with example points along the curve.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .axis { stroke: rgba(255,255,255,0.55); stroke-width: 2; }
      .grid { stroke: rgba(255,255,255,0.10); stroke-width: 1.2; }
      .curve { stroke: #fb923c; stroke-width: 4; fill: none; }
      .pt { fill: rgba(251,146,60,0.90); stroke: rgba(0,0,0,0.25); stroke-width: 1; }
      .label { font-size: 11.6px; fill: rgba(255,255,255,0.86); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.75)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="260" y="18" width="480" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">STEALTHINESS vs EFFECTIVENESS</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Many attacks sit on a Pareto frontier</text>
    </g>

    <!-- Plot card -->
    <g transform="translate(80,100)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="840" height="300" rx="18"/>

      <!-- Grid -->
      <g transform="translate(90,40)">
        <!-- plot area: 680 x 220 -->
        <rect x="0" y="0" width="680" height="220" fill="rgba(0,0,0,0)"/>
        <line class="grid" x1="170" y1="0" x2="170" y2="220"/>
        <line class="grid" x1="340" y1="0" x2="340" y2="220"/>
        <line class="grid" x1="510" y1="0" x2="510" y2="220"/>
        <line class="grid" x1="0" y1="55" x2="680" y2="55"/>
        <line class="grid" x1="0" y1="110" x2="680" y2="110"/>
        <line class="grid" x1="0" y1="165" x2="680" y2="165"/>

        <!-- Axes -->
        <line class="axis" x1="0" y1="220" x2="680" y2="220" marker-end="url(#arrowHead)"/>
        <line class="axis" x1="0" y1="220" x2="0" y2="0" marker-end="url(#arrowHead)"/>

        <!-- Axis labels -->
        <text class="body" x="340" y="252" text-anchor="middle">Stealthiness (harder to detect)  -&gt;</text>
        <text class="body" x="-110" y="-34" transform="rotate(-90)" text-anchor="middle">Effectiveness  -&gt;</text>

        <!-- Trade-off curve (high effect, low stealth) to (low effect, high stealth) -->
        <path class="curve" d="M 40 40 C 190 35, 320 70, 440 110 C 540 145, 610 170, 650 190"/>
        <text class="label" x="430" y="92">Pareto frontier</text>

        <!-- Example points -->
        <circle class="pt" cx="80" cy="54" r="6"/>
        <text class="label" x="95" y="50">Obvious poisons</text>
        <text class="muted" x="95" y="66">high impact, easy to spot</text>

        <circle class="pt" cx="310" cy="86" r="6"/>
        <text class="label" x="325" y="82">Targeted poisoning</text>
        <text class="muted" x="325" y="98">moderate stealth</text>

        <circle class="pt" cx="520" cy="146" r="6"/>
        <text class="label" x="535" y="142">Clean-label / subtle shift</text>
        <text class="muted" x="535" y="158">harder to detect</text>
      </g>

      <text class="muted" x="24" y="278">Defender challenge: filtering must catch malicious data without deleting rare-but-valid corner cases.</text>
    </g>
  </g>
</svg>

