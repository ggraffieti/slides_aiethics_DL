<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Privacy, robustness, utility trade-off</title>
  <desc id="desc">Triangle diagram illustrating trade-offs between privacy, robustness, and utility in deployed machine learning systems, with an example operating point inside the triangle.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .tri { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.35); stroke-width: 2.6; }
      .grid { stroke: rgba(255,255,255,0.08); stroke-width: 1.4; }
      .dot { fill: rgba(68,175,246,0.92); stroke: rgba(0,0,0,0.25); stroke-width: 1; }
      .pr { fill: rgba(68,175,246,0.18); }
      .rb { fill: rgba(34,197,94,0.16); }
      .ut { fill: rgba(245,158,11,0.16); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="250" y="18" width="500" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">PRIVACY vs ROBUSTNESS vs UTILITY</text>
      <text class="muted" x="500" y="68" text-anchor="middle">You pick an operating point; you do not get all three for free</text>
    </g>

    <!-- Triangle card -->
    <g transform="translate(110,105)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="780" height="330" rx="18"/>

      <!-- Triangle geometry (approx equilateral) -->
      <!-- vertices: A(390,50), B(140,260), C(640,260) inside this group -->
      <g transform="translate(0,0)">
        <!-- soft corner fills -->
        <circle class="pr" cx="390" cy="62" r="56"/>
        <circle class="rb" cx="170" cy="260" r="56"/>
        <circle class="ut" cx="610" cy="260" r="56"/>

        <path class="tri" d="M 390 50 L 140 270 L 640 270 Z"/>

        <!-- interior guide lines -->
        <line class="grid" x1="390" y1="50" x2="390" y2="270"/>
        <line class="grid" x1="140" y1="270" x2="515" y2="165"/>
        <line class="grid" x1="640" y1="270" x2="265" y2="165"/>

        <!-- Corner labels -->
        <text class="h2" x="390" y="40" text-anchor="middle">Privacy</text>
        <text class="muted" x="390" y="58" text-anchor="middle">leakage bounds</text>

        <text class="h2" x="140" y="300" text-anchor="middle">Robustness</text>
        <text class="muted" x="140" y="318" text-anchor="middle">worst-case behavior</text>

        <text class="h2" x="640" y="300" text-anchor="middle">Utility</text>
        <text class="muted" x="640" y="318" text-anchor="middle">accuracy / cost</text>

        <!-- Example operating point -->
        <circle class="dot" cx="440" cy="190" r="7"/>
        <text class="body" x="458" y="195">chosen operating point</text>
      </g>

      <text class="muted" x="20" y="312">Example: adding differential privacy can reduce utility; adversarial training can reduce clean accuracy; heavy monitoring can reduce privacy.</text>
    </g>
  </g>
</svg>

