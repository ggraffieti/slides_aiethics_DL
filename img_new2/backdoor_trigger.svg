<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Backdoored model behavior with trigger</title>
  <desc id="desc">Diagram showing that a backdoored model behaves normally on clean inputs but produces attacker-chosen outputs when a trigger pattern is present, and that the behavior can persist under transfer learning.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11.6px; fill: rgba(255,255,255,0.92); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
      .dash { stroke-dasharray: 6 6; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }

      .ok { stroke: #22c55e; }
      .okFill { fill: rgba(34,197,94,0.16); }
      .bd { stroke: #fb923c; }
      .bdFill { fill: rgba(251,146,60,0.18); }
      .warn { stroke: #ef4444; }
      .warnFill { fill: rgba(239,68,68,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="250" y="18" width="500" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">BACKDOOR: CLEAN BEHAVIOR, TRIGGERED MISBEHAVIOR</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Hard to detect with clean validation; can persist under transfer learning</text>
    </g>

    <!-- Two paths -->
    <g transform="translate(60,110)">
      <!-- Clean input -->
      <g filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="240" height="110" rx="18"/>
        <rect class="okFill" x="0" y="0" width="240" height="44" rx="18"/>
        <line class="sep" x1="0" y1="44" x2="240" y2="44"/>
        <text class="h2" x="20" y="30">Clean input</text>
        <g transform="translate(20,58)">
          <rect class="pill" x="0" y="0" width="200" height="40" rx="12"/>
          <text class="mono" x="100" y="26" text-anchor="middle">x (no trigger)</text>
        </g>
      </g>

      <!-- Triggered input -->
      <g transform="translate(0,140)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="240" height="110" rx="18"/>
        <rect class="bdFill" x="0" y="0" width="240" height="44" rx="18"/>
        <line class="sep" x1="0" y1="44" x2="240" y2="44"/>
        <text class="h2" x="20" y="30">Triggered input</text>
        <g transform="translate(20,58)">
          <rect class="pill" x="0" y="0" width="200" height="40" rx="12"/>
          <text class="mono" x="100" y="26" text-anchor="middle">x + trigger</text>
          <!-- trigger glyph -->
          <rect x="166" y="8" width="18" height="18" rx="3" fill="rgba(251,146,60,0.35)" stroke="rgba(255,255,255,0.40)" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Backdoored model -->
      <g transform="translate(300,70)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="260" height="180" rx="18"/>
        <rect class="bdFill" x="0" y="0" width="260" height="44" rx="18"/>
        <line class="sep" x1="0" y1="44" x2="260" y2="44"/>
        <text class="h2" x="20" y="30">Backdoored model</text>
        <text class="muted" x="20" y="62">f_theta(·)</text>
        <g transform="translate(20,82)">
          <text class="body" x="0" y="0">- clean accuracy looks normal</text>
          <text class="body" x="0" y="28">- malicious mapping activates on trigger</text>
          <text class="muted" x="0" y="60">Often implanted via poisoned training data</text>
        </g>
      </g>

      <!-- Outputs -->
      <g transform="translate(600,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="320" height="110" rx="18"/>
        <rect class="okFill" x="0" y="0" width="320" height="44" rx="18"/>
        <line class="sep" x1="0" y1="44" x2="320" y2="44"/>
        <text class="h2" x="20" y="30">Clean output</text>
        <g transform="translate(20,60)">
          <text class="body" x="0" y="0">prediction = correct class</text>
          <text class="muted" x="0" y="24">looks safe in standard tests</text>
        </g>
      </g>

      <g transform="translate(600,140)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="320" height="110" rx="18"/>
        <rect class="warnFill" x="0" y="0" width="320" height="44" rx="18"/>
        <line class="sep" x1="0" y1="44" x2="320" y2="44"/>
        <text class="h2" x="20" y="30">Triggered output</text>
        <g transform="translate(20,60)">
          <text class="body" x="0" y="0">prediction = attacker-chosen target</text>
          <text class="muted" x="0" y="24">systematic and repeatable</text>
        </g>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 240 55 L 300 120" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 240 195 L 300 160" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 560 120 L 600 55" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 560 160 L 600 195" marker-end="url(#arrowHead)"/>
    </g>

    <!-- Transfer learning persistence -->
    <g transform="translate(140,384)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="720" height="46" rx="16"/>
      <text class="body" x="18" y="30">Persistence under transfer learning: fine-tuning a backdoored model can keep the trigger behavior if not explicitly removed.</text>
    </g>
  </g>
</svg>

