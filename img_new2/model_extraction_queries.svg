<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Model extraction via query-based distillation</title>
  <desc id="desc">Flow diagram showing an attacker querying a target model API, collecting input-output pairs, training a surrogate model, and increasing fidelity as query budget grows.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11.6px; fill: rgba(255,255,255,0.92); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
      .axis { stroke: rgba(255,255,255,0.55); stroke-width: 2; }
      .grid { stroke: rgba(255,255,255,0.10); stroke-width: 1.2; }
      .curve { stroke: #44AFF6; stroke-width: 4; fill: none; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .pr { stroke: #44AFF6; }
      .prFill { fill: rgba(68,175,246,0.18); }
      .em { stroke: #f59e0b; }
      .emFill { fill: rgba(245,158,11,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="240" y="18" width="520" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">MODEL EXTRACTION (STEALING) BY QUERIES</text>
      <text class="muted" x="500" y="68" text-anchor="middle">The API becomes a training set for a surrogate</text>
    </g>

    <!-- Flow cards -->
    <g transform="translate(60,110)">
      <!-- Attacker -->
      <g filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="240" height="180" rx="18"/>
        <rect class="emFill" x="0" y="0" width="240" height="56" rx="18"/>
        <line class="sep" x1="0" y1="56" x2="240" y2="56"/>
        <g transform="translate(28,28)">
          <circle class="iconStroke em" cx="0" cy="-4" r="7"/>
          <path class="iconStroke em" d="M -12 18 C -8 6 8 6 12 18"/>
        </g>
        <text class="h2" x="58" y="34">Attacker</text>
        <text class="muted" x="58" y="50">chooses query points</text>
        <g transform="translate(16,88)">
          <text class="body" x="0" y="0">- sample x_i</text>
          <text class="body" x="0" y="28">- adaptively refine near boundary</text>
          <text class="body" x="0" y="56">- manage query budget</text>
        </g>
      </g>

      <!-- Target API -->
      <g transform="translate(320,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="300" height="180" rx="18"/>
        <rect class="prFill" x="0" y="0" width="300" height="56" rx="18"/>
        <line class="sep" x1="0" y1="56" x2="300" y2="56"/>
        <g transform="translate(28,28)">
          <path class="iconStroke pr" d="M -12 -8 H 12 V 8 H -12 Z"/>
          <path class="iconStroke pr" d="M -8 -4 H 8 M -8 0 H 8 M -8 4 H 8"/>
        </g>
        <text class="h2" x="58" y="34">Target model API</text>
        <text class="muted" x="58" y="50">returns y_i (labels/probs)</text>
        <g transform="translate(16,88)">
          <text class="body" x="0" y="0">- class label / probability</text>
          <text class="body" x="0" y="28">- maybe top-k only</text>
          <text class="muted" x="0" y="56">Defenses: rate limits, noise, DP</text>
        </g>
      </g>

      <!-- Surrogate -->
      <g transform="translate(690,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="250" height="180" rx="18"/>
        <rect class="emFill" x="0" y="0" width="250" height="56" rx="18"/>
        <line class="sep" x1="0" y1="56" x2="250" y2="56"/>
        <g transform="translate(28,28)">
          <path class="iconStroke em" d="M -12 6 C -6 -10 6 -10 12 6"/>
          <path class="iconStroke em" d="M -12 6 C -10 16 10 16 12 6"/>
        </g>
        <text class="h2" x="58" y="34">Surrogate model</text>
        <text class="muted" x="58" y="50">trained on (x_i, y_i)</text>
        <g transform="translate(16,88)">
          <text class="body" x="0" y="0">- distillation / fitting</text>
          <text class="body" x="0" y="28">- measure fidelity</text>
          <text class="muted" x="0" y="56">Outcome: IP theft + stronger attacks</text>
        </g>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 240 92 L 320 92" marker-end="url(#arrowHead)"/>
      <text class="muted" x="280" y="80" text-anchor="middle">query x_i</text>
      <path class="arrow" d="M 620 92 L 690 92" marker-end="url(#arrowHead)"/>
      <text class="muted" x="655" y="80" text-anchor="middle">response y_i</text>
    </g>

    <!-- Dataset bubble -->
    <g transform="translate(380,320)" filter="url(#shadow)">
      <rect class="pill" x="0" y="0" width="240" height="56" rx="18"/>
      <text class="mono" x="120" y="24" text-anchor="middle">D_extract = {(x_i, y_i)}</text>
      <text class="muted" x="120" y="42" text-anchor="middle">built from queries</text>
    </g>

    <!-- Fidelity curve -->
    <g transform="translate(650,280)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="300" height="160" rx="18"/>
      <text class="h2" x="16" y="28">Fidelity vs queries</text>
      <g transform="translate(42,44)">
        <!-- plot area 240 x 96 -->
        <line class="axis" x1="0" y1="96" x2="240" y2="96"/>
        <line class="axis" x1="0" y1="96" x2="0" y2="0"/>
        <line class="grid" x1="80" y1="0" x2="80" y2="96"/>
        <line class="grid" x1="160" y1="0" x2="160" y2="96"/>
        <line class="grid" x1="0" y1="32" x2="240" y2="32"/>
        <line class="grid" x1="0" y1="64" x2="240" y2="64"/>
        <path class="curve" d="M 0 86 C 50 80, 90 66, 120 52 C 160 32, 200 20, 240 14"/>
        <text class="muted" x="120" y="120" text-anchor="middle"># queries (budget)</text>
        <text class="muted" x="-48" y="-10" transform="rotate(-90)" text-anchor="middle">fidelity</text>
      </g>
    </g>
  </g>
</svg>

