<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Bilevel optimization view of data poisoning</title>
  <desc id="desc">Diagram showing the inner learning loop that trains model parameters on poisoned data and the outer attacker loop that chooses poisoning to optimize an attack objective under constraints.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12.2px; fill: rgba(255,255,255,0.92); }
      .body { font-size: 12.4px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }

      .po { stroke: #fb923c; }
      .poFill { fill: rgba(251,146,60,0.18); }
      .k { stroke: #44AFF6; }
      .kFill { fill: rgba(68,175,246,0.16); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="210" y="18" width="580" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">DATA POISONING AS BILEVEL OPTIMIZATION</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Attacker chooses training data edits to shape the learned parameters</text>
    </g>

    <!-- Outer loop (attacker) -->
    <g transform="translate(60,100)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="380" height="320" rx="18"/>
      <rect class="poFill" x="0" y="0" width="380" height="58" rx="18"/>
      <line class="sep" x1="0" y1="58" x2="380" y2="58"/>
      <!-- icon: flask -->
      <g transform="translate(28,30)">
        <path class="iconStroke po" d="M -6 -14 L 6 -14 M -2 -14 L -2 -6 L -12 10 C -13 12 -11 14 -8 14 L 8 14 C 11 14 13 12 12 10 L 2 -6 L 2 -14"/>
        <path class="iconStroke po" d="M -6 6 L 6 6"/>
      </g>
      <text class="h2" x="58" y="36">Outer problem (attacker)</text>
      <text class="muted" x="58" y="53">Choose poisoning Delta under constraints</text>

      <g transform="translate(20,92)">
        <text class="mono" x="0" y="0">minimize  L_attack(theta*(Delta))</text>
        <text class="muted" x="0" y="22">examples: targeted error, global degradation</text>

        <text class="body" x="0" y="62">Constraints (stealth + budget):</text>
        <text class="body" x="0" y="90">- |Delta| &lt;= k poisoned points</text>
        <text class="body" x="0" y="116">- perturbation size |delta| &lt;= eps</text>
        <text class="body" x="0" y="142">- label constraints (clean-label vs dirty)</text>
        <text class="body" x="0" y="168">- distributional similarity / detectability</text>

        <text class="muted" x="0" y="214">Goal: maximum effect with minimum detectability</text>
      </g>
    </g>

    <!-- Inner loop (learner) -->
    <g transform="translate(560,100)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="380" height="320" rx="18"/>
      <rect class="kFill" x="0" y="0" width="380" height="58" rx="18"/>
      <line class="sep" x1="0" y1="58" x2="380" y2="58"/>
      <!-- icon: gear -->
      <g transform="translate(28,30)">
        <circle class="iconStroke k" cx="0" cy="0" r="10"/>
        <path class="iconStroke k" d="M 0 -16 V -12 M 0 12 V 16 M -16 0 H -12 M 12 0 H 16 M -11 -11 L -8 -8 M 8 8 L 11 11 M -11 11 L -8 8 M 8 -8 L 11 -11"/>
        <circle cx="0" cy="0" r="2.4" fill="#ffffff"/>
      </g>
      <text class="h2" x="58" y="36">Inner problem (learner)</text>
      <text class="muted" x="58" y="53">Train parameters on poisoned data</text>

      <g transform="translate(20,92)">
        <text class="mono" x="0" y="0">theta*(Delta) = argmin_theta  L_train(theta; D U Delta)</text>
        <text class="muted" x="0" y="22">implemented via SGD/Adam, early stopping, etc.</text>

        <!-- SGD loop glyph -->
        <g transform="translate(10,62)">
          <rect class="pill" x="0" y="0" width="330" height="120" rx="16"/>
          <text class="body" x="20" y="30">training loop:</text>
          <text class="mono" x="20" y="56">theta &lt;- theta - eta * grad_theta L_train(theta; D U Delta)</text>
          <text class="muted" x="20" y="86">model -&gt; predictions -&gt; loss -&gt; gradient -&gt; update</text>
        </g>

        <text class="muted" x="0" y="212">The attacker targets the *training process*, not just the final model.</text>
      </g>
    </g>

    <!-- Connecting arrows -->
    <path class="arrow" d="M 440 200 C 500 200 500 200 560 200" marker-end="url(#arrowHead)"/>
    <text class="muted" x="500" y="188" text-anchor="middle">poisoned data Delta</text>

    <path class="arrow" d="M 560 330 C 500 330 500 330 440 330" marker-end="url(#arrowHead)"/>
    <text class="muted" x="500" y="318" text-anchor="middle">theta*(Delta)</text>

    <text class="muted" x="500" y="462" text-anchor="middle">Key insight: optimizing Delta requires differentiating through training (or approximations).</text>
  </g>
</svg>

