<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Multi-stage attack chain on a self-driving system</title>
  <desc id="desc">End-to-end chain combining poisoned training data, a backdoored model, and a physical trigger at runtime, showing how failures propagate from perception to planning and control.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.6px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .poFill { fill: rgba(251,146,60,0.18); }
      .bdFill { fill: rgba(168,85,247,0.18); }
      .evFill { fill: rgba(239,68,68,0.18); }
      .sysFill { fill: rgba(68,175,246,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="310" y="18" width="580" height="58" rx="14"/>
      <text class="h1" x="600" y="50" text-anchor="middle">MULTI-STAGE ATTACK CHAIN (ADS)</text>
      <text class="muted" x="600" y="68" text-anchor="middle">Poisoning + backdoor + physical trigger -> system-level failure</text>
    </g>

    <!-- Chain -->
    <g transform="translate(40,110)">
      <!-- Nodes (7) -->
      <g filter="url(#shadow)">
        <rect class="card poFill" x="0" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="75" y="34" text-anchor="middle">Poisoned</text>
        <text class="h2" x="75" y="54" text-anchor="middle">data</text>
        <text class="muted" x="75" y="82" text-anchor="middle">training set</text>

        <rect class="card bdFill" x="170" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="245" y="34" text-anchor="middle">Backdoored</text>
        <text class="h2" x="245" y="54" text-anchor="middle">model</text>
        <text class="muted" x="245" y="82" text-anchor="middle">passes clean tests</text>

        <rect class="card sysFill" x="340" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="415" y="34" text-anchor="middle">Deployed</text>
        <text class="h2" x="415" y="54" text-anchor="middle">system</text>
        <text class="muted" x="415" y="82" text-anchor="middle">OTA updates</text>

        <rect class="card evFill" x="510" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="585" y="34" text-anchor="middle">Physical</text>
        <text class="h2" x="585" y="54" text-anchor="middle">trigger</text>
        <text class="muted" x="585" y="82" text-anchor="middle">sticker / patch</text>

        <rect class="card evFill" x="680" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="755" y="34" text-anchor="middle">Perception</text>
        <text class="h2" x="755" y="54" text-anchor="middle">error</text>
        <text class="muted" x="755" y="82" text-anchor="middle">STOP misread</text>

        <rect class="card" x="850" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="925" y="34" text-anchor="middle">Planner</text>
        <text class="h2" x="925" y="54" text-anchor="middle">choice</text>
        <text class="muted" x="925" y="82" text-anchor="middle">wrong action</text>

        <rect class="card" x="1020" y="0" width="150" height="110" rx="18"/>
        <text class="h2" x="1095" y="34" text-anchor="middle">Control</text>
        <text class="h2" x="1095" y="54" text-anchor="middle">hazard</text>
        <text class="muted" x="1095" y="82" text-anchor="middle">unsafe state</text>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 150 55 L 170 55" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 320 55 L 340 55" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 490 55 L 510 55" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 660 55 L 680 55" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 830 55 L 850 55" marker-end="url(#arrowHead)"/>
      <path class="arrow" d="M 1000 55 L 1020 55" marker-end="url(#arrowHead)"/>
    </g>

    <!-- Why clean validation fails -->
    <g transform="translate(120,260)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="860" height="170" rx="18"/>
      <text class="h2" x="20" y="34">Why standard validation misses this</text>
      <g transform="translate(20,64)">
        <text class="body" x="0" y="0">- clean test sets do not include triggers or attacker distributions</text>
        <text class="body" x="0" y="30">- offline metrics miss perception -> planning -> control cascades</text>
        <text class="body" x="0" y="60">- rare events are under-sampled; attacker chooses worst-case corners</text>
        <text class="muted" x="0" y="104">Mitigation requires: threat-model-based tests + runtime monitors + layered defenses.</text>
      </g>
    </g>
  </g>
</svg>

