<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Safety failures vs software bugs</title>
  <desc id="desc">Two-panel diagram contrasting normal software bugs (reproducible, deterministic) with AI safety failures (statistical uncertainty, distribution shift, adversaries, cascading effects).</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.8px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.5px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .pill { fill: rgba(255,255,255,0.09); stroke: rgba(255,255,255,0.22); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ok { stroke: #22c55e; }
      .okFill { fill: rgba(34,197,94,0.16); }
      .warn { stroke: #ef4444; }
      .warnFill { fill: rgba(239,68,68,0.16); }
      .dash { stroke-dasharray: 6 6; }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.85)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="300" y="20" width="400" height="56" rx="14"/>
      <text class="h1" x="500" y="52" text-anchor="middle">SAFETY FAILURES ` NORMAL BUGS</text>
      <text class="muted" x="500" y="70" text-anchor="middle">Uncertainty + adversaries change the engineering problem</text>
    </g>

    <!-- Left card: normal bugs -->
    <g transform="translate(60,110)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="400" height="270" rx="18"/>
      <rect class="okFill" x="0" y="0" width="400" height="58" rx="18"/>
      <line class="sep" x1="0" y1="58" x2="400" y2="58"/>

      <!-- Icon: bug/wrench -->
      <g transform="translate(34,30)">
        <circle cx="0" cy="0" r="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.70)" stroke-width="2"/>
        <path class="iconStroke ok" d="M -6 -2 C -8 -8 -2 -12 4 -10 C 8 -8 8 -3 5 1 L 9 5 L 6 8 L 2 4 C -2 7 -6 4 -6 -2 Z"/>
        <path class="iconStroke ok" d="M -9 10 L 9 10"/>
      </g>

      <text class="h2" x="70" y="36">Normal software bug</text>
      <text class="muted" x="70" y="53">Mostly deterministic, reproducible failures</text>

      <g transform="translate(24,92)">
        <text class="body" x="0" y="0">- Reproducible inputs and execution traces</text>
        <text class="body" x="0" y="30">- Failure mode is stable across runs</text>
        <text class="body" x="0" y="60">- Fix path: patch -&gt; regression test</text>
        <text class="body" x="0" y="90">- Security is often optional unless specified</text>
      </g>
    </g>

    <!-- Middle connector -->
    <g transform="translate(500,240)">
      <line class="sep dash" x1="-20" y1="0" x2="20" y2="0" marker-end="url(#arrow)"/>
      <text class="muted" x="0" y="-14" text-anchor="middle">different</text>
      <text class="muted" x="0" y="14" text-anchor="middle">failure regime</text>
    </g>

    <!-- Right card: safety failures -->
    <g transform="translate(540,110)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="400" height="270" rx="18"/>
      <rect class="warnFill" x="0" y="0" width="400" height="58" rx="18"/>
      <line class="sep" x1="0" y1="58" x2="400" y2="58"/>

      <!-- Icon: warning triangle -->
      <g transform="translate(34,30)">
        <circle cx="0" cy="0" r="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.70)" stroke-width="2"/>
        <path class="iconStroke warn" d="M 0 -12 L 12 10 L -12 10 Z"/>
        <path class="iconStroke warn" d="M 0 -5 V 4"/>
        <circle cx="0" cy="8" r="1.6" fill="#ffffff"/>
      </g>

      <text class="h2" x="70" y="36">AI safety failure</text>
      <text class="muted" x="70" y="53">Stochastic + shifted + adversarial environments</text>

      <g transform="translate(24,92)">
        <text class="body" x="0" y="0">- Statistical uncertainty (tails matter)</text>
        <text class="body" x="0" y="30">- Distribution shift is the default</text>
        <text class="body" x="0" y="60">- Adaptive adversary changes inputs/process</text>
        <text class="body" x="0" y="90">- Small perception errors can cascade into unsafe control</text>
      </g>
    </g>

    <text class="muted" x="500" y="408" text-anchor="middle">Engineering implication: define a threat model, then design layered controls and measurable guarantees.</text>
  </g>
</svg>

