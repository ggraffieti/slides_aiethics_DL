<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Model inversion attack flow</title>
  <desc id="desc">Flow diagram showing an attacker querying a model, receiving outputs and possibly gradients, and optimizing an input to reconstruct training-like data.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 14.8px; font-weight: 820; fill: #ffffff; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11.8px; fill: rgba(255,255,255,0.92); }
      .body { font-size: 12.2px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.2px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .arrow { stroke: rgba(255,255,255,0.74); stroke-width: 2.2; fill: none; }
      .dash { stroke-dasharray: 6 6; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .pr { stroke: #44AFF6; }
      .prFill { fill: rgba(68,175,246,0.18); }
      .em { stroke: #f59e0b; }
      .emFill { fill: rgba(245,158,11,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.80)"/>
    </marker>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="270" y="18" width="460" height="58" rx="14"/>
      <text class="h1" x="500" y="50" text-anchor="middle">MODEL INVERSION (RECONSTRUCTION)</text>
      <text class="muted" x="500" y="68" text-anchor="middle">Recover sensitive training-like inputs via model access</text>
    </g>

    <!-- Main flow -->
    <g transform="translate(60,110)">
      <!-- Attacker -->
      <g filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="240" height="250" rx="18"/>
        <rect class="emFill" x="0" y="0" width="240" height="56" rx="18"/>
        <line class="sep" x1="0" y1="56" x2="240" y2="56"/>
        <!-- icon: person -->
        <g transform="translate(28,28)">
          <circle class="iconStroke em" cx="0" cy="-4" r="7"/>
          <path class="iconStroke em" d="M -12 18 C -8 6 8 6 12 18"/>
        </g>
        <text class="h2" x="58" y="34">Attacker</text>
        <text class="muted" x="58" y="50">chooses queries + objective</text>
        <g transform="translate(16,88)">
          <text class="body" x="0" y="0">- query API (black-box)</text>
          <text class="body" x="0" y="28">- or use gradients (white-box)</text>
          <text class="body" x="0" y="56">- iterate optimization steps</text>
          <text class="muted" x="0" y="92">Goal: reconstruct x_hat that</text>
          <text class="muted" x="0" y="110">matches a target output y</text>
        </g>
      </g>

      <!-- Model -->
      <g transform="translate(320,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="300" height="250" rx="18"/>
        <rect class="prFill" x="0" y="0" width="300" height="56" rx="18"/>
        <line class="sep" x1="0" y1="56" x2="300" y2="56"/>
        <!-- icon: cube -->
        <g transform="translate(28,28)">
          <path class="iconStroke pr" d="M -10 -2 L 0 -8 L 10 -2 L 0 4 Z"/>
          <path class="iconStroke pr" d="M -10 -2 V 8 L 0 14 L 10 8 V -2"/>
          <path class="iconStroke pr" d="M 0 4 V 14"/>
        </g>
        <text class="h2" x="58" y="34">Model f_theta</text>
        <text class="muted" x="58" y="50">returns outputs (and maybe grads)</text>
        <g transform="translate(16,88)">
          <text class="body" x="0" y="0">Outputs: logits / probs / loss</text>
          <text class="body" x="0" y="28">Optional: gradients wrt input</text>
          <text class="muted" x="0" y="64">Stronger leakage when:</text>
          <text class="muted" x="0" y="84">overfitting, rich APIs, weak DP</text>
        </g>
      </g>

      <!-- Reconstruction -->
      <g transform="translate(690,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="250" height="250" rx="18"/>
        <rect class="emFill" x="0" y="0" width="250" height="56" rx="18"/>
        <line class="sep" x1="0" y1="56" x2="250" y2="56"/>
        <!-- icon: image -->
        <g transform="translate(28,28)">
          <rect class="iconStroke em" x="-12" y="-10" width="24" height="20" rx="3"/>
          <path class="iconStroke em" d="M -10 6 L -2 -2 L 2 2 L 10 -6"/>
          <circle cx="-5" cy="-4" r="2.2" fill="#ffffff"/>
        </g>
        <text class="h2" x="58" y="34">Reconstruction</text>
        <text class="muted" x="58" y="50">x_hat (sensitive)</text>

        <!-- pseudo-image grid -->
        <g transform="translate(26,86)" opacity="0.9">
          <rect x="0" y="0" width="198" height="132" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
          <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
            <line x1="0" y1="33" x2="198" y2="33"/>
            <line x1="0" y1="66" x2="198" y2="66"/>
            <line x1="0" y1="99" x2="198" y2="99"/>
            <line x1="49.5" y1="0" x2="49.5" y2="132"/>
            <line x1="99" y1="0" x2="99" y2="132"/>
            <line x1="148.5" y1="0" x2="148.5" y2="132"/>
          </g>
        </g>
      </g>

      <!-- Arrows -->
      <path class="arrow" d="M 240 125 L 320 125" marker-end="url(#arrowHead)"/>
      <text class="muted" x="280" y="112" text-anchor="middle">query x</text>

      <path class="arrow" d="M 620 110 L 690 110" marker-end="url(#arrowHead)"/>
      <text class="muted" x="655" y="96" text-anchor="middle">outputs y</text>

      <path class="arrow dash" d="M 620 160 L 690 160" marker-end="url(#arrowHead)"/>
      <text class="muted" x="655" y="148" text-anchor="middle">optional grads</text>
    </g>

    <!-- Optimization loop callout -->
    <g transform="translate(120,382)" filter="url(#shadow)">
      <rect class="card" x="0" y="0" width="760" height="50" rx="16"/>
      <text class="mono" x="20" y="32">x_hat &lt;- argmin_x  loss( f_theta(x), y_target )  +  lambda * R(x)</text>
    </g>
  </g>
</svg>

