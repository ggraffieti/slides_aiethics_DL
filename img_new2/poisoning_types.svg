<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Poisoning attack types</title>
  <desc id="desc">Three-card infographic explaining availability poisoning, targeted poisoning, and backdoor poisoning with definitions and examples.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 18px; font-weight: 850; fill: #ffffff; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 820; fill: #ffffff; }
      .body { font-size: 12.6px; font-weight: 560; fill: rgba(255,255,255,0.90); }
      .muted { font-size: 11.4px; fill: rgba(255,255,255,0.62); }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .sep { stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .pill { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .iconStroke { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }

      .a { stroke: #ef4444; }
      .aFill { fill: rgba(239,68,68,0.18); }
      .t { stroke: #44AFF6; }
      .tFill { fill: rgba(68,175,246,0.18); }
      .b { stroke: #fb923c; }
      .bFill { fill: rgba(251,146,60,0.18); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="font">
    <!-- Header -->
    <g filter="url(#shadow)">
      <rect class="pill" x="310" y="20" width="380" height="56" rx="14"/>
      <text class="h1" x="500" y="52" text-anchor="middle">POISONING ATTACK TYPES</text>
      <text class="muted" x="500" y="70" text-anchor="middle">Training-time corruption with different goals</text>
    </g>

    <!-- Cards -->
    <g transform="translate(55,110)">
      <!-- Availability -->
      <g filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="290" height="300" rx="18"/>
        <rect class="aFill" x="0" y="0" width="290" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="290" y2="58"/>
        <!-- icon: broken gauge -->
        <g transform="translate(30,30)">
          <path class="iconStroke a" d="M -14 10 C -10 -4 10 -4 14 10"/>
          <path class="iconStroke a" d="M 0 10 L 8 -2"/>
          <circle cx="0" cy="10" r="2.2" fill="#ffffff"/>
        </g>
        <text class="h2" x="60" y="36">Availability</text>
        <text class="muted" x="60" y="53">Global degradation</text>
        <g transform="translate(20,92)">
          <text class="body" x="0" y="0">Goal: make the model fail often</text>
          <text class="body" x="0" y="28">- lower accuracy everywhere</text>
          <text class="body" x="0" y="56">- trigger system shutdowns</text>
          <text class="muted" x="0" y="96">
            <tspan x="0" dy="0">Example: inject mislabeled samples</tspan>
            <tspan x="0" dy="16">so training becomes unstable.</tspan>
          </text>
        </g>
      </g>

      <!-- Targeted -->
      <g transform="translate(325,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="290" height="300" rx="18"/>
        <rect class="tFill" x="0" y="0" width="290" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="290" y2="58"/>
        <!-- icon: crosshair -->
        <g transform="translate(30,30)">
          <circle class="iconStroke t" cx="0" cy="0" r="12"/>
          <path class="iconStroke t" d="M -16 0 L -6 0 M 6 0 L 16 0 M 0 -16 L 0 -6 M 0 6 L 0 16"/>
          <circle cx="0" cy="0" r="2.2" fill="#ffffff"/>
        </g>
        <text class="h2" x="60" y="36">Targeted</text>
        <text class="muted" x="60" y="53">Specific misbehavior</text>
        <g transform="translate(20,92)">
          <text class="body" x="0" y="0">Goal: misclassify a chosen input</text>
          <text class="body" x="0" y="28">- keep overall accuracy high</text>
          <text class="body" x="0" y="56">- create precise failure cases</text>
          <text class="muted" x="0" y="96">
            <tspan x="0" dy="0">Example: cause STOP -&gt; SPEED</tspan>
            <tspan x="0" dy="16">LIMIT only for selected contexts.</tspan>
          </text>
        </g>
      </g>

      <!-- Backdoor -->
      <g transform="translate(650,0)" filter="url(#shadow)">
        <rect class="card" x="0" y="0" width="290" height="300" rx="18"/>
        <rect class="bFill" x="0" y="0" width="290" height="58" rx="18"/>
        <line class="sep" x1="0" y1="58" x2="290" y2="58"/>
        <!-- icon: key -->
        <g transform="translate(30,30)">
          <circle class="iconStroke b" cx="-6" cy="0" r="6"/>
          <path class="iconStroke b" d="M 0 0 H 14 M 10 0 V 6 M 6 0 V 4"/>
        </g>
        <text class="h2" x="60" y="36">Backdoor</text>
        <text class="muted" x="60" y="53">Trigger-based control</text>
        <g transform="translate(20,92)">
          <text class="body" x="0" y="0">Goal: behave normally until triggered</text>
          <text class="body" x="0" y="28">- high clean accuracy</text>
          <text class="body" x="0" y="56">- deterministic malicious behavior</text>
          <text class="muted" x="0" y="96">
            <tspan x="0" dy="0">Example: small sticker pattern</tspan>
            <tspan x="0" dy="16">forces STOP -&gt; GO.</tspan>
          </text>
        </g>
      </g>
    </g>

    <text class="muted" x="500" y="432" text-anchor="middle">Key trade-off across all types: stealthiness vs effectiveness vs attacker budget.</text>
  </g>
</svg>

